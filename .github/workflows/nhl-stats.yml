# Refreshes nhl-stats.json from the NHL's public stats API and commits it,
# so the app on GitHub Pages always has current stats. Runs once each morning,
# after the previous night's games are final; use "Run workflow" on the
# Actions tab to refresh by hand.
name: Refresh NHL stats
on:
  schedule:
    - cron: "17 10 * * *"   # 10:17 UTC = 6:17 am Toronto (5:17 am in winter)
  workflow_dispatch:
    inputs:
      refresh_last:
        description: "Download last season's totals again (normally kept from the previous run)"
        type: boolean
        default: false
permissions:
  contents: write
concurrency: nhl-stats
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull stats
        run: python scripts/fetch_nhl_stats.py nhl-stats.json
        env:
          NHL_REFRESH_LAST: ${{ inputs.refresh_last && '1' || '' }}
      - name: Commit if changed
        run: |
          git config user.name "stats-bot"
          git config user.email "stats-bot@users.noreply.github.com"
          git add nhl-stats.json
          git diff --cached --quiet || git commit -m "NHL stats $(date -u +%Y-%m-%d)"
          git push
