.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}

.stat:last-child{border-right:0}

.hidden{display:none!important}

/* ===== The optimizer =====

   Days don't affect each other, so each day is solved on its own. Because a
   player's value is the same in any slot he can fill, adding players in order
   of projected points and reshuffling the lineup to fit each one (an
   "augmenting path") always finds the best lineup - the same optimum CBC finds. */
function solveDay(players){
  const slotOf=new Array(SLOTS.length).fill(-1);
  const order=players.map((p,k)=>k).sort((a,b)=>(players[b].proj||0)-(players[a].proj||0)||a-b);
  function tryPlace(k,seen){
    for(let s=0;s<SLOTS.length;s++){
      if(seen[s]||!players[k].pos.includes(SLOTS[s])) continue;
      seen[s]=true;
      if(slotOf[s]<0||tryPlace(slotOf[s],seen)){slotOf[s]=k;return true;}
    }
    return false;
  }
  const started=new Set();
  for(const k of order){ if(tryPlace(k,[])) started.add(k); }
  return {slotOf,started};
}
function solveRange(roster,days){
  let total=0,starts=0,benched=0,empty=0;
  const perDay=[],perPlayer=roster.map(()=>({gp:0,starts:0,benched:0}));
  for(const i of days){
    const idx=[];roster.forEach((p,k)=>{if(plays(p.team,i)){idx.push(k);perPlayer[k].gp++;}});
    const ps=idx.map(k=>roster[k]);
    const {slotOf,started}=solveDay(ps);
    let dayPts=0;
    const slots=slotOf.map(j=>j<0?null:idx[j]);
    slots.forEach(k=>{if(k===null)empty++;else{dayPts+=roster[k].proj||0;starts++;perPlayer[k].starts++;}});
    const bench=idx.filter((k,j)=>!started.has(j));
    bench.forEach(k=>perPlayer[k].benched++);
    benched+=bench.length;total+=dayPts;
    perDay.push({i,slots,bench,pts:dayPts,games:idx.length});
  }
  return {total,starts,benched,empty,perDay,perPlayer};
}
function rangeTotal(roster,days){
  let t=0;
  for(const i of days){
    const ps=roster.filter(p=>plays(p.team,i));
    const {started}=solveDay(ps);
    started.forEach(j=>t+=ps[j].proj||0);
  }
  return t;
}

/* ===== Streamers: games a pickup could actually start =====
   A day counts when the team plays AND your lineup, reshuffled if needed,
   can start one more player with that eligibility without benching anyone. */
function gamesGained(roster,days,team,pos){
  const hit=[];
  for(const i of days){
    if(!plays(team,i)) continue;
    const ps=roster.filter(p=>plays(p.team,i));
    const base=solveDay(ps).started.size;
    const withP=solveDay(ps.concat([{pos,proj:0}])).started.size;
    if(withP>base) hit.push(i);
  }
  return hit;
}
function streamerTable(roster,days){
  const rows=[];
  for(const team of TEAMS){
    const teamGames=days.filter(i=>plays(team,i)).length;
    const byCombo={};
    for(const c of COMBOS){byCombo[c.join('/')]=gamesGained(roster,days,team,c);}
    for(const c of COMBOS){
      const key=c.join('/'),n=byCombo[key].length;
      if(n===0) continue;
      // Like the sheet: list a multi-position combo only if it beats every narrower combo
      let best=0;
      for(const s of COMBOS){
        if(s.length<c.length && s.every(x=>c.includes(x))) best=Math.max(best,byCombo[s.join('/')].length);
      }
      if(n<=best) continue;
      rows.push({team,elig:key,n,teamGames,npos:c.length,days:byCombo[key]});
    }
  }
  rows.sort((a,b)=>b.n-a.n||a.npos-b.npos||b.teamGames-a.teamGames||a.team.localeCompare(b.team));
  return rows;
}

/* ===== App state ===== */
const state={data:load(),week:currentWeek(),range:null,tab:'lineup',posFilter:'All',minGames:1,collapsed:{}};
function activeDays(){
  const days=weekDays(state.week);
  if(state.range==='rest'){const ti=todayIndex();return days.filter(i=>i>=ti);}
  return days;
}
function defaultRange(){
  const days=weekDays(state.week),ti=todayIndex();
  return (ti>=days[0]&&ti<=days[days.length-1])?'rest':'full';
}
state.range=defaultRange();

/* ===== Rendering helpers ===== */
const $=s=>document.querySelector(s);
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function f1(x){return (Math.round(x*10)/10).toFixed(1);}
function f2(x){return (Math.round(x*100)/100).toFixed(2);}
function chips(pos){return '<span class="chips">'+POSITIONS.filter(p=>pos.includes(p)).map(p=>'<span class="chip">'+p+'</span>').join('')+'</span>';}
function dayLabel(i){const d=dateOf(i);return DOW[d.getDay()]+' '+md(d);}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),1800);}

function renderHeader(){
  const days=weekDays(state.week);
  $('#wkTitle').innerHTML='Week '+state.week+'<small>'+md(dateOf(days[0]))+' – '+md(dateOf(days[days.length-1]))+' · '+days.length+' days</small>';
  $('#prevWk').disabled=state.week===WEEKS[0];
  $('#nextWk').disabled=state.week===WEEKS[WEEKS.length-1];
  document.querySelectorAll('#rangeSeg button').forEach(b=>b.classList.toggle('on',b.dataset.r===state.range));
  $('#rangeSeg').classList.toggle('hidden',state.tab==='data');
}

function renderLineup(){
  const roster=state.data.roster;
  const allDays=weekDays(state.week),days=activeDays(),ti=todayIndex();
  const r=solveRange(roster,allDays);
  const inRange=new Set(days);
  const sum=r.perDay.filter(d=>inRange.has(d.i)).reduce((a,d)=>{a.pts+=d.pts;a.starts+=d.slots.filter(x=>x!==null).length;a.bench+=d.bench.length;a.empty+=d.slots.filter(x=>x===null).length;return a;},{pts:0,starts:0,bench:0,empty:0});
  let h='<div class="card"><div class="stats">'+
    '<div class="stat big"><b>'+f1(sum.pts)+'</b><span>Proj pts</span></div>'+
    '<div class="stat"><b>'+sum.starts+'</b><span>Starts</span></div>'+
    '<div class="stat"><b>'+sum.bench+'</b><span>Benched</span></div>'+
    '<div class="stat"><b>'+sum.empty+'</b><span>Empty</span></div></div></div>';
  if(!days.length) h+='<p class="note">This week is over. Switch to “Full week” to see it, or move ahead a week.</p>';
  for(const d of r.perDay){
    const past=!inRange.has(d.i);
    const coll=state.collapsed[d.i]??past;
    h+='<div class="card day'+(past?' past':'')+(coll?' collapsed':'')+'" data-day="'+d.i+'">'+
       '<div class="dayhead"><h3>'+dayLabel(d.i)+(d.i===ti?'<span class="tag">TODAY</span>':'')+'</h3>'+
       '<div class="tot">'+f1(d.pts)+' <small>pts · '+d.games+' GP</small></div></div><div class="daybody">';
    if(!d.games){h+='<div class="nogames">None of your players have a game.</div>';}
    else{
      d.slots.forEach((k,s)=>{
        if(k===null) h+='<div class="row empty"><span class="slot">'+SLOTS[s]+'</span><span class="pname">empty</span></div>';
        else{const p=roster[k];h+='<div class="row"><span class="slot">'+SLOTS[s]+'</span><span class="pname">'+esc(p.name)+'<small>'+esc(p.team)+'</small></span><span class="pts">'+f2(p.proj||0)+'</span></div>';}
      });
      if(d.bench.length) h+='<div class="bench">Bench: '+d.bench.map(k=>esc(roster[k].name)+' ('+esc(roster[k].team)+')').join(', ')+'</div>';
    }
    h+='</div></div>';
  }
  $('#tab-lineup').innerHTML=h;
  document.querySelectorAll('#tab-lineup .dayhead').forEach(el=>el.onclick=()=>{
    const card=el.parentElement,i=+card.dataset.day;
    state.collapsed[i]=!card.classList.contains('collapsed');card.classList.toggle('collapsed');
  });
}

function renderRoster(){
  const {roster,watch}=state.data,days=activeDays();
  const r=solveRange(roster,days);
  let h='<div class="sect"><h2>Roster · '+roster.length+'</h2><button class="btn" data-add="roster">+ Add</button></div><div class="card">';
  if(!roster.length) h+='<div class="empty-state">No players yet. Tap “+ Add”.</div>';
  roster.forEach((p,k)=>{
    const s=r.perPlayer[k];
    h+='<div class="prow" data-edit="roster" data-k="'+k+'"><div class="main"><div class="nm">'+esc(p.name)+chips(p.pos)+'</div>'+
       '<div class="sub">'+esc(p.team)+' · '+s.gp+' GP · '+s.starts+' start'+(s.starts===1?'':'s')+(s.benched?' · <span class="w">'+s.benched+' benched</span>':'')+'</div></div>'+
       '<div class="num"><b>'+f2(p.proj||0)+'</b><span>pts/gm</span></div></div>';
  });
  h+='</div>';
  h+='<div class="sect"><h2>Watchlist · pickup ideas</h2><button class="btn" data-add="watch">+ Add</button></div>';
  h+='<p class="note">What each player would add to your optimized lineup for the selected days: added as-is, or swapped for the roster player whose drop costs least.</p><div class="card">';
  if(!watch.length) h+='<div class="empty-state">Add free agents you are considering.</div>';
  const base=r.total;
  watch.forEach((c,k)=>{
    const add=rangeTotal(roster.concat([c]),days)-base;
    let best=null;
    roster.forEach((p,j)=>{const t=rangeTotal(roster.filter((_,x)=>x!==j).concat([c]),days)-base;if(!best||t>best.gain)best={gain:t,name:p.name};});
    const gp=days.filter(i=>plays(c.team,i)).length;
    const cls=x=>x>0.005?'g':(x<-0.005?'w':'');
    h+='<div class="prow" data-edit="watch" data-k="'+k+'"><div class="main"><div class="nm">'+esc(c.name)+chips(c.pos)+'</div>'+
       '<div class="sub">'+esc(c.team)+' · '+gp+' GP · Add: <span class="'+cls(add)+'">'+(add>=0?'+':'')+f1(add)+'</span>'+
       (best?' · Swap '+esc(best.name)+': <span class="'+cls(best.gain)+'">'+(best.gain>=0?'+':'')+f1(best.gain)+'</span>':'')+'</div></div>'+
       '<div class="num"><b>'+f2(c.proj||0)+'</b><span>pts/gm</span></div></div>';
  });
  h+='</div>';
  $('#tab-roster').innerHTML=h;
  document.querySelectorAll('#tab-roster [data-edit]').forEach(el=>el.onclick=()=>openEditor(el.dataset.edit,+el.dataset.k));
  document.querySelectorAll('#tab-roster [data-add]').forEach(el=>el.onclick=()=>openEditor(el.dataset.add,-1));
}

function renderStreamers(){
  const days=activeDays(),roster=state.data.roster;
  const rows=streamerTable(roster,days);
  const f=state.posFilter;
  const sk=rows.filter(r=>r.elig!=='G'&&r.n>=state.minGames&&(f==='All'||r.elig.split('/').includes(f)));
  const gl=rows.filter(r=>r.elig==='G'&&r.n>=state.minGames);
  const fb=['All','C','LW','RW','D'].map(p=>'<button class="fbtn'+(p===f?' on':'')+'" data-pf="'+p+'">'+p+'</button>').join('');
  const mg=[1,2,3].map(n=>'<button class="fbtn'+(n===state.minGames?' on':'')+'" data-mg="'+n+'">'+n+'+ games</button>').join('');
  let h='<p class="note">Teams and positions that could start games in your open slots, after reshuffling your lineup. Look for a free agent who matches.</p>'+
        '<div class="filters">'+fb+'</div><div class="filters">'+mg+'</div>';
  const list=(arr,showElig)=>{
    if(!arr.length) return '<div class="empty-state">No team adds a start here.</div>';
    return arr.map(r=>'<div class="srow"><div class="team">'+r.team+'</div><div><div>'+(showElig?r.elig.split('/').map(p=>'<span class="chip">'+p+'</span>').join(' '):'Goalie')+'</div>'+
      '<div class="days">'+r.days.map(i=>DOW[dateOf(i).getDay()]).join(', ')+' · '+r.teamGames+' team games</div></div>'+
      '<div class="gg">+'+r.n+'<span>starts</span></div></div>').join('');
  };
  h+='<div class="sect"><h2>Skaters</h2></div><div class="card">'+list(sk,true)+'</div>';
  h+='<div class="sect"><h2>Goalies</h2></div><div class="card">'+list(gl,false)+'</div>';
  $('#tab-stream').innerHTML=h;
  document.querySelectorAll('[data-pf]').forEach(b=>b.onclick=()=>{state.posFilter=b.dataset.pf;renderStreamers();});
  document.querySelectorAll('[data-mg]').forEach(b=>b.onclick=()=>{state.minGames=+b.dataset.mg;renderStreamers();});
}

function renderData(){
  const first=dateOf(0),last=dateOf(SCHED.weeks.length-1);
  let h='<div class="sect"><h2>Move your roster</h2></div>'+
    '<p class="note">Edits save in this browser only. To move them to another device, copy the text below and paste it into Import there.</p>'+
    '<div class="card" style="padding:14px"><div class="field"><label>Export</label><textarea id="exportTxt" readonly></textarea></div>'+
    '<div class="actions"><button class="btn primary" id="copyBtn">Copy</button></div></div>'+
    '<div class="card" style="padding:14px"><div class="field"><label>Import</label><textarea id="importTxt" placeholder="Paste exported text here"></textarea></div>'+
    '<div class="actions"><button class="btn primary" id="importBtn">Load</button></div></div>'+
    '<div class="sect"><h2>Reset</h2></div><div class="card" style="padding:14px"><p class="note" style="margin-top:0">Replace your roster and watchlist with the ones from the workbook.</p>'+
    '<button class="btn danger" id="resetBtn">Reset to workbook roster</button></div>'+
    '<p class="note">Schedule: '+first.toDateString()+' – '+last.toDateString()+', '+WEEKS.length+' fantasy weeks, from your workbook.</p>';
  $('#tab-data').innerHTML=h;
  $('#exportTxt').value=JSON.stringify(state.data);
  $('#copyBtn').onclick=async()=>{
    const ta=$('#exportTxt');
    try{await navigator.clipboard.writeText(ta.value);toast('Copied');}
    catch(e){ta.select();try{document.execCommand('copy');toast('Copied');}catch(_){toast('Select the text and copy it');}}
  };
  $('#importBtn').onclick=()=>{
    try{
      const d=JSON.parse($('#importTxt').value);
      if(!d||!Array.isArray(d.roster)) throw 0;
      d.watch=Array.isArray(d.watch)?d.watch:[];
      state.data={roster:d.roster.map(clean),watch:d.watch.map(clean)};save();toast('Loaded');renderAll();
    }catch(e){toast('That text could not be read');}
  };
  $('#resetBtn').onclick=()=>{if(confirm('Replace your roster and watchlist with the workbook versions?')){state.data=JSON.parse(JSON.stringify(SEED));save();toast('Reset');renderAll();}};
}
function clean(p){return {name:String(p.name||'Player'),team:TEAMS.includes(p.team)?p.team:TEAMS[0],pos:(p.pos||[]).filter(x=>POSITIONS.includes(x)),proj:Number(p.proj)||0};}

/* ===== Player editor ===== */
function openEditor(list,k){
  const isNew=k<0,p=isNew?{name:'',team:'',pos:[],proj:''}:state.data[list][k];
  const other=list==='roster'?'watchlist':'roster';
  let h='<h3>'+(isNew?'Add to '+(list==='roster'?'roster':'watchlist'):'Edit player')+'</h3>'+
    '<div class="field"><label>Name</label><input id="eName" autocomplete="off" value="'+esc(p.name)+'"></div>'+
    '<div class="field"><label>Team</label><select id="eTeam"><option value="">Choose…</option>'+TEAMS.map(t=>'<option'+(t===p.team?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>Positions</label><div class="posbtns">'+POSITIONS.map(x=>'<button type="button" data-pos="'+x+'" class="'+(p.pos.includes(x)?'on':'')+'">'+x+'</button>').join('')+'</div></div>'+
    '<div class="field"><label>Projected pts per game</label><input id="eProj" type="number" inputmode="decimal" step="0.01" value="'+esc(p.proj)+'"></div>'+
    '<div class="actions"><button class="btn primary grow" id="eSave">Save</button>'+
    (isNew?'':'<button class="btn" id="eMove">Move to '+other+'</button><button class="btn danger" id="eDel">Delete</button>')+
    '<button class="btn" id="eCancel">Cancel</button></div>';
  $('#sheet').innerHTML=h;$('#sheetBg').classList.add('open');
  document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>b.classList.toggle('on'));
  const read=()=>({name:$('#eName').value.trim(),team:$('#eTeam').value,pos:[...document.querySelectorAll('[data-pos].on')].map(b=>b.dataset.pos),proj:parseFloat($('#eProj').value)||0});
  const valid=q=>{if(!q.name){toast('Enter a name');return false;}if(!q.team){toast('Choose a team');return false;}if(!q.pos.length){toast('Pick at least one position');return false;}return true;};
  $('#eSave').onclick=()=>{const q=read();if(!valid(q))return;if(isNew)state.data[list].push(q);else state.data[list][k]=q;done();};
  $('#eCancel').onclick=closeSheet;
  if(!isNew){
    $('#eDel').onclick=()=>{state.data[list].splice(k,1);done();};
    $('#eMove').onclick=()=>{const q=read();if(!valid(q))return;state.data[list].splice(k,1);state.data[list==='roster'?'watch':'roster'].push(q);done();};
  }
  function done(){save();closeSheet();renderAll();}
}
function closeSheet(){$('#sheetBg').classList.remove('open');}
$('#sheetBg').onclick=e=>{if(e.target.id==='sheetBg')closeSheet();};

/* ===== Wiring ===== */
function renderAll(){
  renderHeader();
  if(state.tab==='lineup')renderLineup();
  if(state.tab==='roster')renderRoster();
  if(state.tab==='stream')renderStreamers();
  if(state.tab==='data')renderData();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['lineup','roster','stream','data'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==state.tab));
  window.scrollTo(0,0);renderAll();
});
document.querySelectorAll('#rangeSeg button').forEach(b=>b.onclick=()=>{state.range=b.dataset.r;state.collapsed={};renderAll();});
function goWeek(delta){
  const i=WEEKS.indexOf(state.week)+delta;if(i<0||i>=WEEKS.length)return;
  state.week=WEEKS[i];state.range=defaultRange();state.collapsed={};renderAll();
}
$('#prevWk').onclick=()=>goWeek(-1);
$('#nextWk').onclick=()=>goWeek(1);
renderAll();
</script>
</body>
