<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lineup Optimizer</title>
<meta name="theme-color" content="#0f1b2d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lineup">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230f1b2d'/%3E%3Cellipse cx='32' cy='38' rx='16' ry='6' fill='%23e8eef6'/%3E%3Crect x='16' y='30' width='32' height='8' fill='%23e8eef6'/%3E%3Cellipse cx='32' cy='30' rx='16' ry='6' fill='%235aa9e6'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#f3f6fa; --card:#ffffff; --ink:#0f1b2d; --muted:#5d6b7e; --faint:#94a1b2; --line:#e2e8f0;
  --accent:#1d6fd6; --accent-ink:#ffffff; --accent-soft:#e3eefc;
  --good:#127a4a; --good-soft:#e2f5ec; --warn:#b4530f; --warn-soft:#fdf0e3; --bad:#b42318;
  --chip:#eef2f7; --shadow:0 1px 2px rgba(15,27,45,.06),0 2px 8px rgba(15,27,45,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0b1320; --card:#131e2f; --ink:#e8eef6; --muted:#a3b1c4; --faint:#6b7a8f; --line:#22314a;
    --accent:#5aa9e6; --accent-ink:#0b1320; --accent-soft:#16304d;
    --good:#4cc38a; --good-soft:#123227; --warn:#f0a35e; --warn-soft:#3a2614; --bad:#ff7b72;
    --chip:#1c2a40; --shadow:none;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1320; --card:#131e2f; --ink:#e8eef6; --muted:#a3b1c4; --faint:#6b7a8f; --line:#22314a;
  --accent:#5aa9e6; --accent-ink:#0b1320; --accent-soft:#16304d;
  --good:#4cc38a; --good-soft:#123227; --warn:#f0a35e; --warn-soft:#3a2614; --bad:#ff7b72;
  --chip:#1c2a40; --shadow:none;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(72px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 8px;border-bottom:1px solid var(--line)}
.weeknav{display:flex;align-items:center;gap:8px}
.weeknav h1{flex:1;text-align:center;font-size:17px;margin:0;font-weight:650}
.weeknav h1 small{display:block;font-size:12px;font-weight:500;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px;line-height:1;cursor:pointer}
.seg{display:flex;background:var(--chip);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
main{padding-top:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:0}
.stat{padding:12px 6px;text-align:center;border-right:1px solid var(--line)}
.stat:last-child{border-right:0}
.stat b{display:block;font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stat.big b{color:var(--accent)}
.dayhead{display:flex;align-items:baseline;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.dayhead h3{margin:0;font-size:15px}
.dayhead .tag{font-size:11px;font-weight:700;color:var(--accent-ink);background:var(--accent);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.dayhead .tot{font-variant-numeric:tabular-nums;font-weight:650}
.dayhead .tot small{color:var(--muted);font-weight:500}
.day.past{opacity:.55}
.day.collapsed .daybody{display:none}
.row{display:flex;align-items:center;gap:10px;padding:7px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.slot{width:34px;flex:none;font-size:11px;font-weight:700;color:var(--muted);text-align:center;background:var(--chip);border-radius:6px;padding:3px 0}
.pname{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pname small{color:var(--muted);margin-left:4px}
.pts{font-variant-numeric:tabular-nums;color:var(--muted);font-size:14px}
.empty .pname{color:var(--faint);font-style:italic}
.bench{padding:8px 14px;background:var(--warn-soft);color:var(--warn);font-size:13px}
.nogames{padding:10px 14px;color:var(--faint);font-size:13px}
.sect{display:flex;align-items:center;justify-content:space-between;margin:18px 2px 8px}
.sect h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.prow{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}
.prow:last-child{border-bottom:0}
.prow .main{flex:1;min-width:0}
.prow .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
.prow .sub .w{color:var(--warn);font-weight:600}
.prow .sub .g{color:var(--good);font-weight:600}
.prow .num{text-align:right;font-variant-numeric:tabular-nums}
.prow .num b{display:block}
.prow .num span{font-size:11px;color:var(--muted);white-space:nowrap}
.prow .num.low b{color:var(--bad)}
.chips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:1px}
.chip{font-size:10.5px;font-weight:700;padding:1px 5px;border-radius:5px;background:var(--chip);color:var(--muted)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.fbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13px;font-weight:600;cursor:pointer;color:var(--muted)}
.fbtn.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.srow{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .team{font-weight:700}
.srow .days{font-size:12.5px;color:var(--muted)}
.gg{font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;text-align:right}
.gg span{display:block;font-size:11px;font-weight:500;color:var(--muted)}
.note{font-size:13px;color:var(--muted);margin:4px 2px 12px}
.empty-state{padding:16px 14px;color:var(--muted);font-size:14px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:640px;margin:0 auto;display:flex}
nav.tabs button{flex:1;border:0;background:transparent;padding:10px 0 9px;font-size:12px;font-weight:600;color:var(--faint);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabs button.on{color:var(--accent)}
.sheet-bg{position:fixed;inset:0;background:rgba(5,10,20,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.sheet-bg.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:640px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
.sheet h3{margin:0 0 14px;font-size:17px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-size:16px}
.field textarea{min-height:140px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.posbtns{display:flex;gap:6px}
.posbtns button{flex:1;padding:9px 0;border:1px solid var(--line);border-radius:10px;background:var(--bg);font-weight:700;cursor:pointer;color:var(--muted)}
.posbtns button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.actions .grow{flex:1}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.show{opacity:1}
.hidden{display:none!important}
.stepper{display:flex;align-items:center;justify-content:space-between;padding:10px 14px;border-bottom:1px solid var(--line)}
.stepper:last-child{border-bottom:0}
.stepper .lbl b{display:block}
.stepper .lbl span{font-size:12.5px;color:var(--muted)}
.stepper .ctl{display:flex;align-items:center;gap:10px}
.stepper .ctl button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:18px;font-weight:700;cursor:pointer}
.stepper .ctl output{min-width:18px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.pad{padding:14px}
.welcome{padding:22px 16px;text-align:center}
.welcome h2{margin:0 0 6px;font-size:18px}
.welcome p{margin:0 0 16px;color:var(--muted)}
.welcome .actions{justify-content:center}
.preview{max-height:260px;overflow:auto;border:1px solid var(--line);border-radius:10px;margin-bottom:12px}
.preview .row.bad{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--muted)}
.srow.tap{grid-template-columns:44px 1fr auto 12px;cursor:pointer}
.srow.tap:active{background:var(--chip)}
.chev{color:var(--faint);font-size:20px;line-height:1}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--chip);color:var(--muted);white-space:nowrap}
.field.ac{position:relative}
.sugg{position:absolute;left:0;right:0;top:100%;margin-top:4px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.15);z-index:5;max-height:300px;overflow:auto}
.sugg .opt{display:flex;justify-content:space-between;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.sugg .opt:last-child{border-bottom:0}
.sugg .opt.on,.sugg .opt:hover{background:var(--accent-soft)}
.sugg .opt small{color:var(--muted);white-space:nowrap}

.pair{display:flex;gap:10px}
.field.half{flex:1;min-width:0}
.field small{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.src{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.02em;padding:0 4px;border-radius:4px;background:var(--chip);color:var(--muted);vertical-align:1px}
.src-manual{background:var(--accent-soft);color:var(--accent)}
.src-none{background:var(--warn-soft);color:var(--warn)}
.toggle{display:flex;gap:10px;align-items:flex-start;cursor:pointer}
.toggle input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent);flex:none}
.toggle small{color:var(--muted)}

a{color:var(--accent)}
.swipe{position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
.swipe:last-child{border-bottom:0}
.swipe .prow{border-bottom:0}
.swipe-actions{position:absolute;top:0;right:0;bottom:0;display:flex;visibility:hidden}
.swipe.dragging .swipe-actions,.swipe.open .swipe-actions{visibility:visible}
.swipe-actions button{width:86px;border:0;font-weight:700;font-size:13px;cursor:pointer;color:#fff}
.mv-roster{background:#1d6fd6}.mv-ir{background:#b4530f}.mv-watch{background:#127a4a}
.swipe-front{position:relative;background:var(--card);transition:transform .2s ease;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.lockbtn{flex:none;width:34px;height:34px;margin-left:-6px;border:0;border-radius:9px;background:transparent;color:var(--faint);cursor:pointer;display:flex;align-items:center;justify-content:center}
.lockbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.lockbtn.on{color:var(--accent);background:var(--accent-soft)}

</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="weeknav">
      <button class="iconbtn" id="prevWk" aria-label="Previous week">‹</button>
      <h1 id="wkTitle">Week</h1>
      <button class="iconbtn" id="nextWk" aria-label="Next week">›</button>
    </div>
    <div class="seg" id="rangeSeg">
      <button data-r="rest">Rest of week</button>
      <button data-r="full">Full week</button>
    </div>
  </div>
</header>

<main class="wrap">
  <section id="tab-lineup"></section>
  <section id="tab-roster" class="hidden"></section>
  <section id="tab-stream" class="hidden"></section>
  <section id="tab-settings" class="hidden"></section>
</main>

<nav class="tabs"><div class="in">

  <button data-tab="roster"><svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19c.6-3 2.8-4.8 5.5-4.8s4.9 1.8 5.5 4.8"/><path d="M16 5.2a3 3 0 0 1 0 5.6M18 14.6c1.3.7 2.2 2.2 2.5 4.4"/></svg>Roster</button>
  <button data-tab="stream"><svg viewBox="0 0 24 24"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg>Streamers</button>
  <button data-tab="settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>Settings</button>
</div></nav>

<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

const POSITIONS = ['C','LW','RW','D','G'];

const TEAMS = Object.keys(SCHED.teams).sort();
const TEAM_ALIASES = {SJS:'SJ',TB:'TBL',LA:'LAK',NJ:'NJD',UTAH:'UTA',UTH:'UTA',ARI:'UTA',WAS:'WSH',CLB:'CBJ',MON:'MTL',NAS:'NSH',VEG:'VGK',LV:'VGK',WIN:'WPG',CAL:'CGY',FLO:'FLA',STL:'STL',NYI:'NYI',NYR:'NYR'};

const OLD_KEY = 'lineupOptimizer.v1';

/* ===== Dates ===== */
const START = parseDate(SCHED.start);
function parseDate(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function dateOf(i){const d=new Date(START);d.setDate(d.getDate()+i);return d;}
function md(d){return (d.getMonth()+1)+'/'+d.getDate();}
function todayIndex(){const t=new Date();t.setHours(0,0,0,0);return Math.round((t-START)/86400000);}
const WEEKS = [...new Set(SCHED.weeks)].sort((a,b)=>a-b);
function weekDays(w){const out=[];SCHED.weeks.forEach((x,i)=>{if(x===w)out.push(i);});return out;}
function currentWeek(){
  const ti=todayIndex();
  if(ti<0) return WEEKS[0];
  if(ti>=SCHED.weeks.length) return WEEKS[WEEKS.length-1];
  return SCHED.weeks[ti];
}
function plays(team,i){const s=SCHED.teams[team];return !!s && s[i]==='1';}

/* ===== Storage (this browser only; always guarded) ===== */
function blank(){return {roster:[],ir:[],watch:[],settings:{leagueName:'',slots:{...DEFAULT_SLOTS},yahooLeagueId:'',ppgSource:'derived',useManual:true}};}
function normalize(d){
  const b=blank();
  if(!d||typeof d!=='object') return b;
  b.roster=Array.isArray(d.roster)?d.roster.map(cleanPlayer).filter(Boolean):[];
  b.watch=Array.isArray(d.watch)?d.watch.map(cleanPlayer).filter(Boolean):[];
  b.ir=Array.isArray(d.ir)?d.ir.map(cleanPlayer).filter(Boolean):[];
  const s=d.settings||{};
  b.settings.leagueName=String(s.leagueName||'');
  b.settings.yahooLeagueId=String(s.yahooLeagueId||'');
  if(PPG_SOURCES.some(x=>x.key===s.ppgSource)) b.settings.ppgSource=s.ppgSource;
  if(s.useManual===false) b.settings.useManual=false;
  if(s.slots&&typeof s.slots==='object'){
    for(const t of SLOT_TYPES){const n=parseInt(s.slots[t.key],10);b.settings.slots[t.key]=Number.isFinite(n)?Math.max(0,Math.min(9,n)):0;}
  }
  return b;
}
function load(){
  try{
    const raw=localStorage.getItem(STORE_KEY);
    if(raw) return normalize(JSON.parse(raw));
    const old=localStorage.getItem(OLD_KEY);           // carry over edits from version 1
    if(old){const d=normalize(JSON.parse(old));localStorage.setItem(STORE_KEY,JSON.stringify(d));return d;}
  }catch(e){}
  return blank();
}
function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state.data));}catch(e){toast('Could not save in this browser');}}

/* ===== Player cleanup (used by the editor, Excel paste and import) ===== */
function normTeam(x){
  const t=String(x||'').trim().toUpperCase().replace(/[^A-Z.]/g,'').replace(/\./g,'');
  if(TEAMS.includes(t)) return t;
  if(TEAM_ALIASES[t]&&TEAMS.includes(TEAM_ALIASES[t])) return TEAM_ALIASES[t];
  return '';
}
function parsePositions(x){
  const parts=String(x||'').toUpperCase().split(/[^A-Z]+/).filter(Boolean);
  const out=[];
  for(const p of parts){
    if(POSITIONS.includes(p)&&!out.includes(p)) out.push(p);
    else if((p==='F'||p==='FWD')) for(const q of ['C','LW','RW']) if(!out.includes(q)) out.push(q);
  }
  return POSITIONS.filter(p=>out.includes(p));
}
function cleanPlayer(p){
  if(!p) return null;
  const name=String(p.name||'').trim(); if(!name) return null;
  const team=normTeam(p.team); const pos=Array.isArray(p.pos)?p.pos.filter(x=>POSITIONS.includes(x)):parsePositions(p.pos);
  const out={name,team:team||TEAMS[0],pos:pos.length?pos:['C']};
  // Version 1-4 stored one number ("proj"); it was hand-entered, so it becomes Manual.
  const manual=p.manual!==undefined?p.manual:p.proj;
  for(const [k,v] of [['manual',manual],['derived',p.derived],['l14',p.l14],['l30',p.l30]]){const n=numOrNull(v);if(n!==null)out[k]=n;}
  const st=pctOrNull(p.start); if(st!==null&&st!==100) out.start=st;
  if(p.id) out.id=p.id;
  if(p.locked) out.locked=true;
  return out;
}

/* ===== Points per game: four sources =====
   derived = League Fan Pts / 84: per TEAM game, so missed games and goalie
             start rate are already in it.
   manual, l14, l30 = per game PLAYED (per start for goalies), so goalies are
             scaled by their start %.
   Manual wins whenever it is filled in (unless turned off in Settings).
   Otherwise the chosen source is used, falling back to the next one that
   has a value. */
const PPG_SOURCES=[
  {key:'derived',label:'Derived',short:'der',perStart:false},
  {key:'l14',label:'Last 14 days',short:'L14',perStart:true},
  {key:'l30',label:'Last 30 days',short:'L30',perStart:true}
];
const FALLBACK={derived:['derived','l30','l14'],l14:['l14','l30','derived'],l30:['l30','l14','derived']};
function numOrNull(v){if(v===null||v===undefined||v==='')return null;const n=parseFloat(String(v).replace(',','.'));return Number.isFinite(n)?n:null;}
function pctOrNull(v){
  if(v===null||v===undefined||v==='')return null;
  let n=parseFloat(String(v).replace('%','').replace(',','.'));
  if(!Number.isFinite(n))return null;
  if(n>0&&n<=1&&!String(v).includes('%'))n*=100;   // 0.55 means 55%
  return Math.max(0,Math.min(100,Math.round(n)));
}
function isGoalie(p){return p.pos.includes('G');}
function effPPG(p){
  const st=state.data.settings;
  let key=null,val=null;
  if(st.useManual&&p.manual!=null){key='manual';val=p.manual;}
  else for(const k of FALLBACK[st.ppgSource]||FALLBACK.derived){if(p[k]!=null){key=k;val=p[k];break;}}
  if(key===null) return {val:0,key:null,base:0,scaled:false};
  const perStart=key==='manual'||PPG_SOURCES.find(s=>s.key===key).perStart;
  const scaled=perStart&&isGoalie(p)&&p.start!=null&&p.start!==100;
  return {val:scaled?val*p.start/100:val,key,base:val,scaled};
}
function srcShort(key){return key==='manual'?'man':key?PPG_SOURCES.find(s=>s.key===key).short:'none';}
/* Copies of the players with .proj set to the value the optimizer should use. */
function effList(list){return list.map(p=>{const e=effPPG(p);return Object.assign({},p,{proj:e.val,eff:e});});}

/* ===== Lineup slots from settings ===== */
function slotList(){
  const out=[];const s=state.data.settings.slots;
  for(const t of SLOT_TYPES) for(let n=0;n<(s[t.key]||0);n++) out.push(t);
  return out;
}

/* ===== The optimizer =====
   Each day, put players into the lineup slots (one player per slot, one slot
   per player, only slots his positions allow, only if his team plays) to get
   the most projected points. Days don't affect each other, so each day is
   solved on its own. A player is worth the same in any slot he can fill, so
   adding players from highest projection down, reshuffling the lineup to fit
   each one when needed, always finds the best lineup - the same answer
   OpenSolver/CBC gives. This holds for any slot setup, including F and Util. */
function solveDay(players,slots){
  const slotOf=new Array(slots.length).fill(-1);
  const order=players.map((p,k)=>k).sort((a,b)=>(players[b].proj||0)-(players[a].proj||0)||a-b);
  function tryPlace(k,seen){
    for(let s=0;s<slots.length;s++){
      if(seen[s]||!players[k].pos.some(p=>slots[s].elig.includes(p))) continue;
      seen[s]=true;
      if(slotOf[s]<0||tryPlace(slotOf[s],seen)){slotOf[s]=k;return true;}
    }
    return false;
  }
  const started=new Set();
  for(const k of order){ if(tryPlace(k,[])) started.add(k); }
  return {slotOf,started};
}
function solveRange(roster,days,slots){
  let total=0;
  const perDay=[],perPlayer=roster.map(()=>({gp:0,starts:0,benched:0}));
  for(const i of days){
    const idx=[];roster.forEach((p,k)=>{if(plays(p.team,i)){idx.push(k);perPlayer[k].gp++;}});
    const ps=idx.map(k=>roster[k]);
    const {slotOf,started}=solveDay(ps,slots);
    let dayPts=0;
    const filled=slotOf.map(j=>j<0?null:idx[j]);
    filled.forEach(k=>{if(k!==null){dayPts+=roster[k].proj||0;perPlayer[k].starts++;}});
    const bench=idx.filter((k,j)=>!started.has(j));
    bench.forEach(k=>perPlayer[k].benched++);
    total+=dayPts;
    perDay.push({i,filled,bench,pts:dayPts,games:idx.length});
  }
  return {total,perDay,perPlayer};
}
function rangeTotal(roster,days,slots){
  let t=0;
  for(const i of days){
    const ps=roster.filter(p=>plays(p.team,i));
    solveDay(ps,slots).started.forEach(j=>t+=ps[j].proj||0);
  }
  return t;
}

/* ===== Streamers: games a pickup could actually start =====
   A day counts when the team plays AND the lineup, reshuffled if needed, can
   start one more player with that eligibility without benching anyone. */
function gamesGained(roster,days,slots,team,pos){
  const hit=[];
  for(const i of days){
    if(!plays(team,i)) continue;
    const ps=roster.filter(p=>plays(p.team,i));
    if(solveDay(ps.concat([{pos,proj:0}]),slots).started.size>solveDay(ps,slots).started.size) hit.push(i);
  }
  return hit;
}
function streamerTable(roster,days,slots){
  const rows=[];
  for(const team of TEAMS){
    const teamGames=days.filter(i=>plays(team,i)).length;
    const by={};
    for(const c of COMBOS) by[c.join('/')]=gamesGained(roster,days,slots,team,c);
    for(const c of COMBOS){
      const key=c.join('/'),n=by[key].length;
      if(!n) continue;
      let best=0;   // list a multi-position combo only if it beats every narrower one
      for(const s of COMBOS) if(s.length<c.length&&s.every(x=>c.includes(x))) best=Math.max(best,by[s.join('/')].length);
      if(n<=best) continue;
      rows.push({team,elig:key,n,teamGames,npos:c.length,days:by[key]});
    }
  }
  rows.sort((a,b)=>b.n-a.n||a.npos-b.npos||b.teamGames-a.teamGames||a.team.localeCompare(b.team));
  return rows;
}

/* ===== Excel paste =====
   Copying cells from Excel gives one row per line with tabs between columns.
   Expected columns: Player, Team, Positions, Proj pts/game (extra columns are
   ignored, a header row is skipped). */
function parsePaste(text){
  const rows=[];
  const lines=String(text||'').replace(/\r/g,'').split('\n').map(l=>l.trim()?l:null).filter(Boolean);
  // A 5th column is read as goalie start % only when its header says "start",
  // or the value has a % sign; otherwise extra columns are ignored.
  let startByHeader=false;
  for(const line of lines){
    let cells=line.split('\t');
    if(cells.length<3) cells=line.split(/\s*[;|]\s*/);
    if(cells.length<3) cells=line.split(/\s{2,}/);
    cells=cells.map(c=>c.trim());
    const [name,team,pos,ppg,start]=cells;
    if(!name) continue;
    if(/^(player|name)$/i.test(name)&&/team/i.test(team||'')){startByHeader=/start/i.test(start||'');continue;}   // header row
    const t=normTeam(team),p=parsePositions(pos);
    const problems=[];
    if(!t) problems.push('team "'+(team||'')+'"');
    if(!p.length) problems.push('positions');
    const st=(startByHeader||/%/.test(start||''))?pctOrNull(start):null;
    rows.push({name,team:t,pos:p,ppg:numOrNull(ppg),start:st,problems});
  }
  return rows;
}
/* Name matching for "update": full name first, then last name + team
   (so "MacKinnon, COL" matches "Nathan MacKinnon, COL"). */
function nameKey(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z ]/g,'').replace(/\s+/g,' ').trim();}
function lastName(s){const k=nameKey(s).split(' ');return k[k.length-1]||'';}
function findMatch(p,rows){
  const full=rows.filter(r=>nameKey(r.name)===nameKey(p.name)&&(!r.team||r.team===p.team));
  if(full.length===1) return full[0];
  const byFull=rows.filter(r=>nameKey(r.name)===nameKey(p.name));
  if(byFull.length===1) return byFull[0];
  const last=rows.filter(r=>lastName(r.name)===lastName(p.name)&&r.team===p.team);
  return last.length===1?last[0]:null;
}

/* Swipe handling: only horizontal drags move the card, so vertical scrolling
   still works. Releasing past halfway opens the action buttons. */
let openSwipe=null;
function closeOpenSwipe(except){
  if(openSwipe&&openSwipe!==except){const o=openSwipe;o.querySelector('.swipe-front').style.transform='';setTimeout(()=>o.classList.remove('open'),200);}
  if(openSwipe!==except) openSwipe=null;
}
function wireSwipe(el){
  const front=el.querySelector('.swipe-front'),list=el.dataset.list,k=+el.dataset.k;
  const width=()=>el.querySelector('.swipe-actions').offsetWidth;
  let x0=null,y0=0,dx=0,mode=null,startOffset=0,moved=false;
  front.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'&&e.button!==0) return;
    x0=e.clientX;y0=e.clientY;dx=0;mode=null;moved=false;
    startOffset=el.classList.contains('open')?-width():0;
  });
  front.addEventListener('pointermove',e=>{
    if(x0===null) return;
    const mx=e.clientX-x0,my=e.clientY-y0;
    if(!mode){
      if(Math.abs(mx)<8&&Math.abs(my)<8) return;
      mode=Math.abs(mx)>Math.abs(my)?'h':'v';
      if(mode==='h'){closeOpenSwipe(el);el.classList.add('dragging');front.style.transition='none';try{front.setPointerCapture(e.pointerId);}catch(_){}}
    }
    if(mode!=='h') return;
    moved=true;
    dx=Math.max(-width()-24,Math.min(0,startOffset+mx));
    front.style.transform='translateX('+dx+'px)';
  });
  const end=()=>{
    if(mode==='h'){
      front.style.transition='';
      const open=dx<-width()/2;
      front.style.transform=open?'translateX('+(-width())+'px)':'';
      el.classList.toggle('open',open);el.classList.remove('dragging');
      openSwipe=open?el:null;
    }
    x0=null;mode=null;
  };
  front.addEventListener('pointerup',end);
  front.addEventListener('pointercancel',end);
  front.addEventListener('click',e=>{
    if(moved){moved=false;return;}
    if(e.target.closest('[data-lock]')){toggleLock(list,k);return;}
    if(el.classList.contains('open')){closeOpenSwipe(null);return;}
    closeOpenSwipe(null);
    openEditor(list,k);
  });
  el.querySelectorAll('[data-move]').forEach(b=>b.onclick=()=>movePlayer(list,k,b.dataset.move));
}

/* Tapping a streamer row lists that team's players who have the eligibility,
   with the starts each would actually add (using his own positions). */
function samePlayer(a,b){
  if(a.id&&b.id) return a.id===b.id;
  if(a.team!==b.team) return false;
  return nameKey(a.name)===nameKey(b.name)||(lastName(a.name)===lastName(b.name)&&(nameKey(a.name).split(' ').length===1||nameKey(b.name).split(' ').length===1));
}
function whereIs(p){for(const l of ['roster','ir','watch']) if(state.data[l].some(q=>samePlayer(q,p))) return l; return null;}
function openStreamerPlayers(team,elig){
  const days=activeDays(),slots=slotList(),roster=effList(state.data.roster);
  const isG=elig.includes('G');
  const list=DIR.filter(p=>p.team===team&&elig.every(e=>p.pos.includes(e)))
    .map(p=>({p,gain:gamesGained(roster,days,slots,team,p.pos).length,where:whereIs(p)}))
    .sort((x,y)=>y.gain-x.gain||x.p.name.localeCompare(y.p.name));
  const teamGames=days.filter(i=>plays(team,i)).length;
  let h='<h3>'+team+' · '+(isG?'Goalies':elig.join(' / '))+'</h3>'+
    '<p class="note" style="margin-top:-6px">'+teamGames+' team games in the selected days. Starts shown are what each player would add using his own eligibility. Check Yahoo to see who is actually a free agent.</p>';
  if(!list.length) h+='<div class="empty-state">No '+team+' players in the directory match this eligibility.</div>';
  else h+='<div class="card">'+list.map((x,i)=>'<div class="prow"><div class="main"><div class="nm">'+esc(x.p.name)+chips(x.p.pos)+'</div>'+
      '<div class="sub">+'+x.gain+' start'+(x.gain===1?'':'s')+(x.p.src==='ranks'?' · <span class="muted">not on NHL active roster</span>':'')+'</div></div>'+
      (x.where?'<span class="badge">'+LIST_NAMES[x.where]+'</span>':'<button class="btn" data-watch="'+i+'">+ Watch</button>')+'</div>').join('')+'</div>';
  h+='<div class="actions"><button class="btn grow" id="spClose">Close</button></div>';
  openSheet(h);
  $('#spClose').onclick=closeSheet;
  document.querySelectorAll('[data-watch]').forEach(b=>b.onclick=()=>{
    const x=list[+b.dataset.watch];
    state.data.watch.push({id:x.p.id||undefined,name:x.p.name,team:x.p.team,pos:x.p.pos.slice()});
    state.data.watch=state.data.watch.map(cleanPlayer).filter(Boolean);
    save();b.outerHTML='<span class="badge">Watchlist</span>';toast(x.p.name+' added to watchlist; add his PPG to see his value');
  });
}

  root.innerHTML=h;

  root.querySelectorAll('[data-inc],[data-dec]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.inc||b.dataset.dec,d=b.dataset.inc?1:-1;
    st.slots[k]=Math.max(0,Math.min(9,(st.slots[k]||0)+d));save();renderSettings();

/* ===== Sheets: player editor and Excel paste ===== */
function openSheet(html){$('#sheet').innerHTML=html;$('#sheetBg').classList.add('open');}
function closeSheet(){$('#sheetBg').classList.remove('open');}
$('#sheetBg').onclick=e=>{if(e.target.id==='sheetBg')closeSheet();};

/* Name search: ignores accents and case; matches the start of first or last
   name, or anywhere in the full name ("lafren" finds Lafrenière). */
function searchDir(q){
  const k=nameKey(q); if(k.length<2) return [];
  const scored=[];
  for(const d of DIR){
    const n=nameKey(d.name),parts=n.split(' ');
    let s=-1;
    if(n.startsWith(k)) s=0; else if(parts.some(w=>w.startsWith(k))) s=1; else if(n.includes(k)) s=2;
    if(s>=0) scored.push([s,d]);
  }
  return scored.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).slice(0,8).map(x=>x[1]);
}
function wireAutocomplete(input,box,onPick){
  let items=[],active=-1;
  const close=()=>{box.classList.add('hidden');active=-1;};
  const paint=()=>{
    box.innerHTML=items.map((d,i)=>'<div class="opt'+(i===active?' on':'')+'" data-i="'+i+'" role="option"><span>'+esc(d.name)+'</span><small>'+d.team+' · '+d.pos.join(', ')+'</small></div>').join('');
    box.classList.toggle('hidden',!items.length);
    box.querySelectorAll('.opt').forEach(o=>o.onpointerdown=e=>{e.preventDefault();onPick(items[+o.dataset.i]);close();});
  };
  input.addEventListener('input',()=>{items=searchDir(input.value);active=-1;paint();});
  input.addEventListener('keydown',e=>{
    if(box.classList.contains('hidden')) return;
    if(e.key==='ArrowDown'){active=Math.min(items.length-1,active+1);paint();e.preventDefault();}
    else if(e.key==='ArrowUp'){active=Math.max(0,active-1);paint();e.preventDefault();}
    else if(e.key==='Enter'&&active>=0){onPick(items[active]);close();e.preventDefault();}
    else if(e.key==='Escape') close();
  });
  input.addEventListener('blur',()=>setTimeout(close,120));
}

function openEditor(list,k){
  const isNew=k<0,p=isNew?{name:'',team:'',pos:[]}:state.data[list][k];
  const others=['roster','ir','watch'].filter(x=>x!==list);
  const v=x=>x==null?'':esc(x);
  const numField=(id,label,val,hint)=>'<div class="field half"><label>'+label+'</label><input id="'+id+'" type="number" inputmode="decimal" step="0.01" placeholder="—" value="'+v(val)+'">'+(hint?'<small>'+hint+'</small>':'')+'</div>';
  openSheet('<h3>'+(isNew?'Add to '+LIST_NAMES[list]:'Edit player')+'</h3>'+
    '<div class="field ac"><label>Name</label><input id="eName" autocomplete="off" autocapitalize="words" spellcheck="false" placeholder="Start typing a player’s name" value="'+esc(p.name)+'"><div class="sugg hidden" id="eSugg" role="listbox"></div></div>'+
    '<div class="field"><label>Team</label><select id="eTeam"><option value="">Choose…</option>'+TEAMS.map(t=>'<option'+(t===p.team?' selected':'')+'>'+t+'</option>').join('')+'</select></div>'+
    '<div class="field"><label>Positions</label><div class="posbtns">'+POSITIONS.map(x=>'<button type="button" data-pos="'+x+'" class="'+(p.pos.includes(x)?'on':'')+'">'+x+'</button>').join('')+'</div></div>'+
    '<div class="field" style="margin-bottom:6px"><label>Points per game</label></div>'+
    '<div class="pair">'+numField('eManual','Manual',p.manual,'Overrides the others')+numField('eDerived','Derived',p.derived,'League pts ÷ 84')+'</div>'+
    '<div class="pair">'+numField('eL14','Last 14 days',p.l14,'From Yahoo')+numField('eL30','Last 30 days',p.l30,'From Yahoo')+'</div>'+
    '<div class="field" id="eStartWrap"><label>Start % (goalies)</label><input id="eStart" type="number" inputmode="numeric" step="1" min="0" max="100" placeholder="100" value="'+v(p.start)+'">'+
    '<small>Scales Manual and Yahoo values, which are per start. Derived already includes it.</small></div>'+
    '<div class="actions"><button class="btn primary grow" id="eSave">Save</button>'+
    (isNew?'':others.map(o=>'<button class="btn" data-emove="'+o+'">To '+LIST_NAMES[o]+'</button>').join('')+'<button class="btn danger" id="eDel">Delete</button>')+
    '<button class="btn" id="eCancel">Cancel</button></div>');
  let pickedId=p.id||null,pickedName=p.name||'';
  wireAutocomplete($('#eName'),$('#eSugg'),d=>{
    pickedId=d.id;pickedName=d.name;
    $('#eName').value=d.name;$('#eTeam').value=d.team;
    document.querySelectorAll('[data-pos]').forEach(b=>b.classList.toggle('on',d.pos.includes(b.dataset.pos)));
    showStart();
  });
  const showStart=()=>$('#eStartWrap').classList.toggle('hidden',!document.querySelector('[data-pos="G"].on'));
  document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');showStart();});
  showStart();
  const read=()=>{
    const q={name:$('#eName').value.trim(),team:$('#eTeam').value,pos:[...document.querySelectorAll('[data-pos].on')].map(b=>b.dataset.pos)};
    if(pickedId&&nameKey(q.name)===nameKey(pickedName)) q.id=pickedId;   // keep the directory link unless the name was changed
    for(const [key,id] of [['manual','eManual'],['derived','eDerived'],['l14','eL14'],['l30','eL30']]){const n=numOrNull($('#'+id).value);if(n!==null)q[key]=n;}
    if(q.pos.includes('G')){const st=pctOrNull($('#eStart').value);if(st!==null&&st!==100)q.start=st;}
    if(p.locked) q.locked=true;   // editing keeps the lock
    return q;
  };
  const valid=q=>{if(!q.name){toast('Enter a name');return false;}if(!q.team){toast('Choose a team');return false;}if(!q.pos.length){toast('Pick at least one position');return false;}return true;};
  $('#eSave').onclick=()=>{const q=read();if(!valid(q))return;if(isNew)state.data[list].push(q);else state.data[list][k]=q;done();};
  $('#eCancel').onclick=closeSheet;
  if(!isNew){
    $('#eDel').onclick=()=>{state.data[list].splice(k,1);done();};
    document.querySelectorAll('[data-emove]').forEach(b=>b.onclick=()=>{const q=read();if(!valid(q))return;state.data[list].splice(k,1);state.data[b.dataset.emove].push(q);done();});
  }
  function done(){save();closeSheet();renderAll();}
}

function openPaste(list){
  const name=LIST_NAMES[list];
  let field=list==='roster'?'manual':'derived';
  openSheet('<h3>Paste from Excel</h3>'+
    '<p class="note" style="margin-top:-6px">Copy these columns in order from Excel: <b>Player · Team · Positions · PPG</b>, plus an optional <b>Start %</b> column for goalies (header “Start %”, or values like 55%). A header row is fine; other extra columns are ignored.</p>'+
    '<div class="field"><label>The PPG column is</label><div class="seg" id="pField" style="margin-top:0">'+
      '<button data-f="manual">Manual</button><button data-f="derived">Derived</button></div></div>'+
    '<div class="field"><textarea id="pTxt" placeholder="Player name&#9;TOR&#9;C, LW&#9;3.25"></textarea></div>'+
    '<div id="pPrev"></div>'+
    '<div class="actions"><button class="btn primary grow" id="pUpdate" disabled>Update matching players</button></div>'+
    '<div class="actions"><button class="btn grow" id="pReplace" disabled>Replace '+name+'</button><button class="btn grow" id="pAppend" disabled>Add to '+name+'</button><button class="btn" id="pCancel">Cancel</button></div>'+
    '<p class="note">“Update” fills that PPG into players already on your roster, IR and watchlist, matched by name. “Replace” and “Add” change the '+name+' list itself.</p>');
  const paintField=()=>document.querySelectorAll('#pField button').forEach(b=>b.classList.toggle('on',b.dataset.f===field));
  document.querySelectorAll('#pField button').forEach(b=>b.onclick=()=>{field=b.dataset.f;paintField();});
  paintField();
  let parsed=[];
  const everyone=()=>['roster','ir','watch'].flatMap(l=>state.data[l]);
  const update=()=>{
    parsed=parsePaste($('#pTxt').value);
    const good=parsed.filter(r=>!r.problems.length);
    const matches=everyone().filter(p=>findMatch(p,good)).length;
    let h='';
    if(parsed.length){
      h='<div class="preview">'+parsed.map(r=>'<div class="row'+(r.problems.length?' bad':'')+'"><span class="pname">'+esc(r.name)+
        (r.team?'<small>'+r.team+'</small>':'')+(r.pos.length?chips(r.pos):'')+'</span><span class="pts">'+
        (r.problems.length?'check '+esc(r.problems.join(', ')):(r.ppg===null?'no PPG':f2(r.ppg))+(r.start!==null?' · '+r.start+'%':''))+'</span></div>').join('')+'</div>'+
        '<p class="note">'+good.length+' rows ready'+(parsed.length>good.length?', '+(parsed.length-good.length)+' skipped':'')+' · '+matches+' of your players matched.</p>';
    }
    $('#pPrev').innerHTML=h;
    $('#pReplace').disabled=$('#pAppend').disabled=!good.length;
    $('#pUpdate').disabled=!matches;
  };
  $('#pTxt').oninput=update;
  const toPlayer=r=>{const q={name:r.name,team:r.team,pos:r.pos};if(r.ppg!==null)q[field]=r.ppg;if(r.start!==null&&r.start!==100&&r.pos.includes('G'))q.start=r.start;return q;};
  const commit=replace=>{
    const good=parsed.filter(r=>!r.problems.length).map(toPlayer);
    if(replace) state.data[list]=good; else state.data[list]=state.data[list].concat(good);
    save();closeSheet();toast((replace?'Loaded ':'Added ')+good.length+' players');renderAll();
  };
  $('#pUpdate').onclick=()=>{
    const good=parsed.filter(r=>!r.problems.length);let n=0;
    for(const p of everyone()){
      const m=findMatch(p,good);if(!m)continue;
      if(m.ppg!==null){p[field]=m.ppg;n++;}
      if(m.start!==null&&p.pos.includes('G')){if(m.start===100)delete p.start;else p.start=m.start;}
    }
    save();closeSheet();toast('Updated '+field+' PPG for '+n+' players');renderAll();
  };
  $('#pReplace').onclick=()=>commit(true);
  $('#pAppend').onclick=()=>commit(false);
  $('#pCancel').onclick=closeSheet;
  setTimeout(()=>{try{$('#pTxt').focus();}catch(e){}},50);
}

/* ===== Wiring ===== */
function renderAll(){
  renderHeader();
  if(state.tab==='lineup')renderLineup();
  if(state.tab==='roster')renderRoster();
  if(state.tab==='stream')renderStreamers();
  if(state.tab==='settings')renderSettings();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>{
  state.tab=b.dataset.tab;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x===b));
  ['lineup','roster','stream','settings'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==state.tab));
  window.scrollTo(0,0);renderAll();
});
document.querySelectorAll('#rangeSeg button').forEach(b=>b.onclick=()=>{state.range=b.dataset.r;state.collapsed={};renderAll();});
function goWeek(delta){
  const i=WEEKS.indexOf(state.week)+delta;if(i<0||i>=WEEKS.length)return;
  state.week=WEEKS[i];state.range=defaultRange();state.collapsed={};renderAll();
}
$('#prevWk').onclick=()=>goWeek(-1);
$('#nextWk').onclick=()=>goWeek(1);
renderAll();
