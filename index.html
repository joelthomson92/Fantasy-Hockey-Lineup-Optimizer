/* ===== Trades =====
   Ranges run from today. With playoffs set, "regular season" stops before the
   first playoff week; "playoffs" is just the chosen weeks. */
function playoffWeeks(){const p=state.data.settings.playoffs;return p.on?p.weeks.slice():[];}
function playoffLabel(){const w=playoffWeeks();if(!w.length)return '';const d0=weekDays(w[0]),d1=weekDays(w[w.length-1]);return 'weeks '+w.join(', ')+' ('+md(dateOf(d0[0]))+' – '+md(dateOf(d1[d1.length-1]))+')';}
function tradeRanges(){
  const ti=Math.max(0,todayIndex()),pw=playoffWeeks();
  const all=SCHED.weeks.map((w,i)=>({w,i})).filter(x=>x.i>=ti);
  if(!pw.length) return [{key:'season',label:'Rest of season',weeks:[...new Set(all.map(x=>x.w))],days:all.map(x=>x.i)}];
  const first=pw[0];
  const reg=all.filter(x=>x.w<first),po=all.filter(x=>pw.includes(x.w));
  return [{key:'reg',label:'Regular season',weeks:[...new Set(reg.map(x=>x.w))],days:reg.map(x=>x.i)},
          {key:'po',label:'Playoffs',weeks:pw.slice(),days:po.map(x=>x.i)}];
}
function weekBreakdown(before,after,range,slots){
  return range.weeks.map(w=>{
    const days=range.days.filter(i=>SCHED.weeks[i]===w);
    return {w,days,b:startsTotal(before,days,slots),a:startsTotal(after,days,slots),pb:rangeTotal(before,days,slots),pa:rangeTotal(after,days,slots)};
  }).filter(x=>x.days.length);
}
function playerStarts(roster,days,slots,name){   // starts for one player in the optimized lineup
  let n=0;
  for(const i of days){const ps=roster.filter(p=>plays(p.team,i));const {started}=solveDay(ps,slots);started.forEach(j=>{if(ps[j].name===name)n++;});}
  return n;
}
/* ===== Trade finder =====
   Tries every 1-for-1 swap between your roster and each other team's active
   roster (league data, IR excluded). Each side is re-optimized day by day over
   the chosen range, so a trade scores well when it fixes a positional or
   schedule logjam, not just when one player has a higher PPG.
   Your side uses your own values (manual, start %); their side uses the
   neutral source values (projection / Last 14 / Last 30) for both players.
   Speed: adding a player can raise a day's best lineup by at most his PPG
   (the lineup problem is a matroid), so each side's gain is capped by
   "his PPG × his games − what losing the outgoing player costs". Swaps whose
   cap is already below the bar are skipped without solving. */
function dayTotal(roster,i,slots){const ps=roster.filter(p=>plays(p.team,i));let t=0;solveDay(ps,slots).started.forEach(j=>t+=ps[j].proj||0);return t;}
function neutralPPG(p,src){const e=effPPG({name:p.name,team:p.team,pos:p.pos,id:p.id},src);return e.key?e.val:0;}
function neutralMine(p,src){const e=effPPG({name:p.name,team:p.team,pos:p.pos,id:p.id},src);return e.key?e.val:effPPG(p).val;}   // no source number → your own value
/* A team's players for trades. IR players are included and assumed to be back
   in the lineup right away (marked .ir so the screen can say so). */
function leagueRoster(owner,src){
  const S=state.data.stash&&state.data.stash[owner];
  const mk=(p,ir)=>{const q={name:p.name,team:p.team,pos:p.pos.slice(),id:p.id||((dirLookup(p)||{}).id)};if(ir)q.ir=true;q.proj=neutralPPG(q,src);q.noVal=!effPPG(q,src).key;return q;};
  if(S) return S.roster.map(p=>mk(p,false)).concat(S.ir.map(p=>mk(p,true)));   // your saved edits
  return state.data.lg.players.filter(r=>r.owner===owner).map(r=>{
    const d=dirLookup(r);const pos=r.pos&&r.pos.length?r.pos:(d?d.pos:['C']);
    return mk({name:d&&!r.id?d.name:r.name,team:r.team,pos,id:r.id||(d&&d.id)||undefined},/^IR/.test(r.slot||''));});
}
function myTradeRaw(){return state.data.roster.concat(state.data.ir.map(p=>Object.assign({},p,{ir:true})));}
function irTag(p){return p.ir?' <span class="chip st">IR</span>':'';}
/* --- Trade engine ---------------------------------------------------------
   A side = one team's roster (with .proj set) over the chosen days. Trades of
   up to 2-for-2 are scored by re-optimizing that side's daily lineups.
   Uneven trades: the side that ends up over the roster limit drops the player
   whose loss costs least; the side that frees a spot can fill it with the best
   free agent (exact in Check a trade, estimated in the finder). */
function sideModel(roster,days,slots){
  const base=new Map();for(const i of days)base.set(i,dayTotal(roster,i,slots));
  const irN=Math.min(irLimit(),roster.filter(p=>p.ir).length);   // IR players count as active, so their IR slots act as extra roster spots
  return {roster,days,slots,base,gp:roster.map(p=>days.filter(i=>plays(p.team,i))),lc:new Map(),lim:rosterLimit()+irN};
}
function lossOf(M,ks){   // points lost over the range if these players leave, nobody added
  const key=ks.slice().sort((a,b)=>a-b).join(',');
  if(M.lc.has(key)) return M.lc.get(key);
  const rest=M.roster.filter((_,x)=>!ks.includes(x)),ds=new Set();ks.forEach(k=>M.gp[k].forEach(i=>ds.add(i)));
  let l=0;for(const i of ds)l+=M.base.get(i)-dayTotal(rest,i,M.slots);
  M.lc.set(key,l);return l;
}
function faPoolBy(src){return freeAgentPool().map(f=>Object.assign({},f,{proj:neutralPPG(f,src)})).filter(f=>f.proj>0);}
function bestFill(roster,days,slots,pool){   // best free agent to add, searched best-first with a cap
  const cand=pool.map(f=>({f,ub:f.proj*days.filter(i=>plays(f.team,i)).length})).sort((a,b)=>b.ub-a.ub);
  const bt=new Map();let best=null;
  for(const c of cand){
    if(best&&c.ub<=best.gain) break;
    let g=0;for(const i of days){if(!plays(c.f.team,i))continue;if(!bt.has(i))bt.set(i,dayTotal(roster,i,slots));g+=dayTotal(roster.concat([c.f]),i,slots)-bt.get(i);}
    if(!best||g>best.gain) best={p:c.f,gain:g};
  }
  return best&&best.gain>0.005?best:null;
}
/* What a freed roster spot is really worth: the best free agent you could add,
   minus what you could already gain without the trade by cutting your least
   useful player for that free agent. If good free agents are out there, you
   can grab one either way, so the extra spot is worth only the player you
   get to keep. */
function spotModel(M,pool){
  let worst=-1,wl=Infinity;M.roster.forEach((_,k)=>{const l=lossOf(M,[k]);if(l<wl){wl=l;worst=k;}});
  const r0=bestFill(M.roster,M.days,M.slots,pool);
  const r1=worst>=0?bestFill(M.roster.filter((_,x)=>x!==worst),M.days,M.slots,pool):null;
  const G1=Math.max(0,(r1?r1.gain:0)-(worst>=0?wl:0));
  const swap=G1>0?{out:M.roster[worst],in:r1.p}:null;   // the move this team could make anyway
  return {R0:r0?r0.gain:0,G1,pool,swap,alt:swap?M.roster.filter((_,x)=>x!==worst).concat([r1.p]):M.roster};
}
function evalSide(M,outs,ins,opts){
  let after=M.roster.filter((_,x)=>!outs.includes(x)).concat(ins);
  const lim=M.lim,before=M.roster.length,ch=new Set();
  outs.forEach(k=>M.gp[k].forEach(i=>ch.add(i)));
  ins.forEach(p=>M.days.forEach(i=>{if(plays(p.team,i))ch.add(i);}));
  let drop=null,fill=null,fillGain=0;
  if(after.length>Math.max(lim,before)){             // over the limit: drop the cheapest player (not one just received)
    let best=null;
    after.forEach((p,x)=>{
      if(ins.includes(p)) return;
      let l;
      if(opts.exactDrop){const rest=after.filter((_,y)=>y!==x);l=0;for(const i of M.days)if(plays(p.team,i))l+=dayTotal(after,i,M.slots)-dayTotal(rest,i,M.slots);}
      else l=(p.proj||0)*M.days.filter(i=>plays(p.team,i)).length;
      if(!best||l<best.l)best={x,l};
    });
    drop=after[best.x];after=after.filter((_,y)=>y!==best.x);
    M.days.forEach(i=>{if(plays(drop.team,i))ch.add(i);});
  }
  let gain=0;for(const i of ch)gain+=dayTotal(after,i,M.slots)-M.base.get(i);
  if(after.length<before&&after.length<lim&&opts.fill&&opts.fill!=='none'){   // the trade frees a roster spot
    const S=opts.spot;
    if(opts.fill==='est') fillGain=Math.max(0,S.R0-S.G1);
    else {const f=bestFill(after,M.days,M.slots,S.pool);if(f){fill=f.p;fillGain=f.gain-S.G1;after=after.concat([f.p]);}}
  }
  return {gain:gain+fillGain,drop,fill,fillGain,after};
}
function myValued(src){return myTradeRaw().map(p=>Object.assign({},p,{proj:neutralMine(p,src)}));}
function pairs(ix){const o=[];for(let a=0;a<ix.length;a++)for(let b=a+1;b<ix.length;b++)o.push([ix[a],ix[b]]);return o;}
const SIZES={'1x1':[1,1],'2x1':[2,1],'1x2':[1,2],'2x2':[2,2]};
const SIZE_LABEL={'1x1':'1-for-1','2x1':'2-for-1','1x2':'1-for-2','2x2':'2-for-2'};
const FAIR_TOL=[0.05,0.1,0.15,0.25];
function srcLabel(k){return PPG_SOURCES.find(s=>s.key===k).label;}

/* The finder works in two steps:
   1. Pair: keep only trades that look fair by the "match" numbers - the
      per-game averages your league-mates see (Season, Last 30…). The points
      per game each side sends must be within the tolerance of each other.
   2. Solve: score those fair-looking trades with the "solve" numbers over the
      chosen days, re-optimizing both teams' daily lineups (schedule, positions,
      bench crunch), and rank by what they do for you. */
const finder={team:'',sort:'me',size:'1x1',match:'season',solve:'derived',tol:0.1,results:null,sig:'',busy:false,progress:0,shown:25};
function finderSig(range,team){return JSON.stringify([team||'',range.key,range.days.length,state.data.roster,state.data.ir,state.data.settings,state.data.stash,state.data.lg.asOf,state.data.lg.players.length,myTeamName(),finder.size,finder.match,finder.solve,finder.tol,PPG_SIGNATURE(),NHL&&NHL.fetchedAt]);}
function PPG_SIGNATURE(){return state.data.proj.asOf+'|'+state.data.proj.list.length;}
function looksFair(give,get){   // per-game totals by the match source, as a league-mate would add them up
  const a=give,b=get,hi=Math.max(a,b);
  return hi<=0?true:Math.abs(a-b)<=finder.tol*hi;
}
/* Fair-looking combos per team are ranked by an upper bound on your gain
   (adding players can raise a day's lineup by at most their PPG) and solved
   exactly in that order, stopping once the bound can't beat the 12th best. */
async function runFinder(range,done){
  const slots=slotList(),days=range.days,mine=myTeamName(),K=12,CAP=700,S=finder.solve,Mt=finder.match;
  let tick=performance.now();
  const breathe=async()=>{if(performance.now()-tick>40){await new Promise(r=>setTimeout(r,0));tick=performance.now();}};
  const myRaw=myTradeRaw(),me=sideModel(myValued(S),days,slots);
  const pool=faPoolBy(S),Sme=spotModel(me,pool),Rme=Math.max(0,Sme.R0-Sme.G1);
  const myMatch=myRaw.map(p=>neutralMine(p,Mt));
  const teams=state.data.teams.map(t=>t.name).filter(n=>n!==mine&&teamHasPlayers(n)&&(!finder.team||n===finder.team));
  const sizes=finder.size==='all'?Object.keys(SIZES):[finder.size];
  const myIx=me.roster.map((_,k)=>k);
  const out=[];let checked=0,fair=0,solved=0;
  finder.busy=true;finder.progress=0;
  for(let ti=0;ti<teams.length;ti++){
    const owner=teams[ti],them=sideModel(leagueRoster(owner,S),days,slots);
    const lbl=$('#fProg');if(lbl)lbl.textContent='Checking '+owner+'… '+(ti+1)+'/'+teams.length;
    await breathe();
    const Sth=spotModel(them,pool),Rth=Math.max(0,Sth.R0-Sth.G1);
    const thMatch=them.roster.map(p=>neutralPPG(p,Mt));
    const thIx=them.roster.map((_,j)=>j);
    const combos=[];
    for(const sz of sizes){
      const [a,b]=SIZES[sz];
      const outsL=a===1?myIx.map(k=>[k]):pairs(myIx),insL=b===1?thIx.map(j=>[j]):pairs(thIx);
      for(const outs of outsL){await breathe();
        const gm=outs.reduce((s,k)=>s+myMatch[k],0);
        for(const ins of insL){
          checked++;
          const tm=ins.reduce((s,j)=>s+thMatch[j],0);
          if(!looksFair(gm,tm)) continue;
          fair++;
          const ubMe=ins.reduce((s,j)=>s+them.roster[j].proj*them.gp[j].length,0)-lossOf(me,outs)+(a>b?Rme:0);
          if(ubMe<=0.05) continue;
          let key=ubMe;
          if(finder.sort==='both'){const ubTh=outs.reduce((s,k)=>s+me.roster[k].proj*me.gp[k].length,0)-lossOf(them,ins)+(b>a?Rth:0);key=Math.min(ubMe,ubTh);}
          combos.push({outs,ins,sz,key,gm,tm});
        }}
    }
    combos.sort((x,y)=>y.key-x.key);
    const found=[];let n=0;
    for(const c of combos){
      if(found.length>=K&&c.key<=found[K-1].key) break;
      if(++n>CAP) break;
      solved++;await breathe();
      const my=evalSide(me,c.outs,c.ins.map(j=>them.roster[j]),{fill:'est',spot:Sme});
      if(my.gain<=0.05) continue;
      const th=evalSide(them,c.ins,c.outs.map(k=>me.roster[k]),{fill:'est',spot:Sth});
      const r={owner,sz:c.sz,give:c.outs.map(k=>myRaw[k]),get:c.ins.map(j=>them.roster[j]),my:my.gain,th:th.gain,gm:c.gm,tm:c.tm,
        key:finder.sort==='both'?Math.min(my.gain,th.gain):my.gain};
      found.push(r);found.sort((x,y)=>y.key-x.key);
    }
    out.push(...found);
    finder.progress=(ti+1)/teams.length;
    const bar=$('#fBar');if(bar)bar.style.width=Math.round(finder.progress*100)+'%';
  }
  finder.busy=false;finder.results={list:out,checked,fair,solved,teams:teams.length,days:days.length,sizes,match:Mt,solve:S};done();
}
function finderFresh(range){   // results of an all-teams search still cover a single team
  return !!finder.results&&(finder.sig===finderSig(range,finder.team)||(finder.allTeams&&finder.sig===finderSig(range,'')));
}
function segBar(id,label,opts,cur,attr,hint){
  return '<div class="field"><label>'+label+'</label><div class="seg" id="'+id+'" style="margin:0">'+opts.map(([v,t])=>'<button '+attr+'="'+v+'" class="'+(String(cur)===String(v)?'on':'')+'">'+t+'</button>').join('')+'</div>'+(hint?'<small>'+hint+'</small>':'')+'</div>';
}
function finderHTML(range){
  const mine=myTeamName(),haveLg=state.data.lg.players.length>0;
  let h='<div class="sect"><h2>Trade finder</h2></div>';
  if(!haveLg||!mine) return h+'<div class="card"><div class="empty-state">'+(!haveLg?'Import league data (Settings → Import) so the app knows every team’s roster.':'Mark your team in Settings → Teams.')+'</div></div>';
  const others=state.data.teams.filter(t=>!t.mine&&teamHasPlayers(t.name));
  const src=PPG_SOURCES.map(s=>[s.key,s.label]);
  h+='<div class="card pad">'+
    segBar('fSize','Trade size',[['1x1','1 for 1'],['2x1','2 for 1'],['1x2','1 for 2'],['2x2','2 for 2'],['all','All']],finder.size,'data-fsize','“2 for 1” = you give two players for one of theirs.')+
    segBar('fMatch','Points match by',src,finder.match,'data-fmatch','How your league-mates judge value: the points per game each side sends must be close by these numbers.')+
    segBar('fTol','Fair within',FAIR_TOL.map(t=>[t,'±'+Math.round(t*100)+'%']),finder.tol,'data-ftol')+
    segBar('fSolve','Points solve with',src,finder.solve,'data-fsolve','What the trade is really worth: these numbers over '+esc(range.label.toLowerCase())+', with daily lineups re-optimized.')+
    '<div class="pair"><div class="field half"><label>Team</label><select id="fTeam"><option value="">All teams</option>'+others.map(t=>'<option'+(t.name===finder.team?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></div>'+
    '<div class="field half"><label>Sort</label><select id="fSort"><option value="me"'+(finder.sort==='me'?' selected':'')+'>Best for me</option><option value="both"'+(finder.sort==='both'?' selected':'')+'>Both gain</option></select></div></div>';
  const fresh=finderFresh(range);
  if(finder.busy) h+='<div class="prog"><div id="fBar" style="width:'+Math.round(finder.progress*100)+'%"></div></div><div class="muted" id="fProg" style="font-size:13px;margin-top:6px">Checking…</div>';
  else h+='<button class="btn primary" id="fGo" style="width:100%">'+(fresh?'Search again':'Find trades')+(finder.team?' with '+esc(finder.team):' · all teams')+'</button>';
  h+='</div>';
  if(!fresh||finder.busy){
    if(!finder.busy) h+='<p class="note">Finds '+(finder.size==='all'?'1-for-1 to 2-for-2':SIZE_LABEL[finder.size])+' trades that look fair by '+esc(srcLabel(finder.match).toLowerCase())+' points per game (within ±'+Math.round(finder.tol*100)+'%), then scores them with '+esc(srcLabel(finder.solve).toLowerCase())+' numbers over '+esc(range.label.toLowerCase())+' ('+range.days.length+' days). An uneven trade makes the team that ends up over the limit drop its least useful player, and credits the team that frees a spot with roughly what that spot adds.</p>';
    return h;
  }
  const R=finder.results;
  let list=R.list.filter(x=>!finder.team||x.owner===finder.team).map(x=>Object.assign(x,{key:finder.sort==='both'?Math.min(x.my,x.th):x.my}));
  list.sort((x,y)=>y.key-x.key||y.my-x.my);
  const sg=x=>(x>=0?'+':'')+f1(x);
  h+='<p class="note">'+list.length+' prospect'+(list.length===1?'':'s')+(finder.team?' with '+esc(finder.team):' across '+R.teams+' teams')+' · '+R.fair.toLocaleString()+' of '+R.checked.toLocaleString()+' trades look fair by '+esc(srcLabel(R.match).toLowerCase())+'. '+(finder.sort==='both'?'Sorted by the smaller of the two gains.':'Sorted by your gain.')+' “Looks” compares the points per game each side sends. Tap one to check it side by side.</p>';
  if(!list.length) return h+'<div class="card"><div class="empty-state">No fair-looking trade of this size helps you over this range. Try a wider “Fair within” or another trade size.</div></div>';
  const names=a=>a.map(p=>esc(p.name)+(p.ir?' <span class="chip st">IR</span>':'')).join(' + ');
  const row=(x,showOwner)=>'<div class="prow" data-prosp="'+R.list.indexOf(x)+'" style="cursor:pointer"><div class="main">'+
      '<div class="nm">'+names(x.give)+' <span class="muted">→</span> '+names(x.get)+(x.get.length===1?chips(x.get[0].pos)+statusBadge(x.get[0]):'')+(R.sizes.length>1?' <span class="badge">'+SIZE_LABEL[x.sz]+'</span>':'')+'</div>'+
      '<div class="sub">'+(showOwner?esc(x.owner)+' · ':'')+'you <b class="'+(x.my>0?'g':'')+'">'+sg(x.my)+'</b> · them <b class="'+(x.th>0?'g':x.th<0?'w':'')+'">'+sg(x.th)+'</b> pts · looks '+f2(x.gm)+' for '+f2(x.tm)+'</div></div>'+
      '<div class="num"><b class="g">'+sg(x.my)+'</b><span>pts</span></div></div>';
  if(!finder.team){   // best few with each team, teams ordered by their best prospect
    const by=new Map();for(const x of list){if(!by.has(x.owner))by.set(x.owner,[]);by.get(x.owner).push(x);}
    for(const [owner,xs] of by) h+='<div class="sect"><h2>'+esc(owner)+' · '+xs.length+'</h2>'+(xs.length>3?'<button class="btn" data-fteam="'+esc(owner)+'">All '+xs.length+'</button>':'')+'</div><div class="card">'+xs.slice(0,3).map(x=>row(x,false)).join('')+'</div>';
    return h;
  }
  h+='<div class="card">'+list.slice(0,finder.shown).map(x=>row(x,true)).join('')+'</div>';
  if(list.length>finder.shown) h+='<div class="actions"><button class="btn grow" id="fMore">Show more ('+(list.length-finder.shown)+')</button></div>';
  return h;
}
function wireFinder(range){
  if(!$('#fTeam')) return;
  const set=(k,v)=>{if(finder.busy){toast('Wait for the search to finish');return;}finder[k]=v;finder.shown=25;renderTrades();};
  $('#fTeam').onchange=e=>{if(finder.busy){e.target.value=finder.team;return;}finder.team=e.target.value;finder.shown=25;renderTrades();};
  $('#fSort').onchange=e=>{finder.sort=e.target.value;finder.shown=25;renderTrades();};   // re-sorts; no new search needed
  document.querySelectorAll('[data-fsize]').forEach(b=>b.onclick=()=>set('size',b.dataset.fsize));
  document.querySelectorAll('[data-fmatch]').forEach(b=>b.onclick=()=>set('match',b.dataset.fmatch));
  document.querySelectorAll('[data-fsolve]').forEach(b=>b.onclick=()=>set('solve',b.dataset.fsolve));
  document.querySelectorAll('[data-ftol]').forEach(b=>b.onclick=()=>set('tol',+b.dataset.ftol));
  if($('#fGo')) $('#fGo').onclick=()=>{finder.shown=25;const sig=finderSig(range,finder.team),all=!finder.team;runFinder(range,()=>{finder.sig=sig;finder.allTeams=all;if(state.tab==='trades')renderTrades();});renderTrades();};
  if($('#fMore')) $('#fMore').onclick=()=>{finder.shown+=25;renderTrades();};
  document.querySelectorAll('[data-fteam]').forEach(b=>b.onclick=()=>{if(finder.busy)return;finder.team=b.dataset.fteam;finder.shown=25;renderTrades();window.scrollTo(0,0);});
  document.querySelectorAll('[data-prosp]').forEach(el=>el.onclick=()=>{
    const x=finder.results.list[+el.dataset.prosp];
    if(!x.give.every(p=>myTradeRaw().some(q=>samePlayer(q,p)))){toast('Your roster has changed since this search');return;}
    trade.team=x.owner;trade.give=x.give.map(pRef);trade.get=x.get.map(pRef);
    renderTrades();const c=$('#tCheck');if(c)c.scrollIntoView({behavior:'smooth',block:'start'});
  });
}

/* --- Check a trade: both teams, side by side --- */
function pRef(p){return {name:p.name,team:p.team,id:p.id};}
const trade={team:'',give:[],get:[],range:null,fill:true};
function renderTrades(){
  const root=$('#tab-trades'),slots=slotList(),st=state.data.settings;
  const ranges=tradeRanges();
  if(!ranges.some(r=>r.key===trade.range)) trade.range=ranges[0].key;
  const rangeT=ranges.find(r=>r.key===trade.range);
  const mineN=myTeamName(),others=state.data.teams.filter(t=>!t.mine&&teamHasPlayers(t.name));
  if(trade.team&&!others.some(t=>t.name===trade.team)){trade.team='';trade.get=[];}
  const myRaw=myTradeRaw(),theirs=trade.team?leagueRoster(trade.team,finder.solve):[];
  trade.give=trade.give.filter(r=>myRaw.some(p=>samePlayer(p,r)));
  trade.get=trade.get.filter(r=>theirs.some(p=>samePlayer(p,r)));
  const pick=(list,sel,attr)=>'<div class="tpick">'+list.map((p,k)=>{const on=sel.some(r=>samePlayer(p,r));
      return '<button type="button" '+attr+'="'+k+'" class="'+(on?'on':'')+'" aria-pressed="'+on+'"><b>'+esc(p.name)+'</b><small>'+p.pos.join('/')+' · '+esc(p.team)+(p.ir?' · IR':'')+'</small></button>';}).join('')+'</div>';
  let h=finderHTML(rangeT)+
    '<div class="sect" id="tCheck"><h2>Check a trade</h2></div>';
  if(!others.length){
    h+='<div class="card"><div class="empty-state">Import league data and pick your team in Settings → Teams to check trades with other teams.</div></div>';
  } else {
    h+='<div class="card pad">'+
      '<div class="field"><label>Trade with</label><select id="tTeam"><option value="">Choose a team…</option>'+others.map(t=>'<option'+(t.name===trade.team?' selected':'')+'>'+esc(t.name)+'</option>').join('')+'</select></div>'+
      '<div class="field"><label>You give · '+trade.give.length+'/2</label>'+pick(myRaw,trade.give,'data-tg')+'</div>'+
      (trade.team?'<div class="field"><label>You get · '+trade.get.length+'/2</label>'+pick(theirs,trade.get,'data-tt')+'</div>':'')+
      '<p class="note" style="margin:0 0 10px">Scored with the finder’s <b>'+esc(srcLabel(finder.solve))+'</b> numbers; “looks” uses <b>'+esc(srcLabel(finder.match))+'</b>.</p>'+
      '<label class="toggle" style="margin:0"><input type="checkbox" id="tFill"'+(trade.fill?' checked':'')+'><span><b>Fill a freed roster spot</b><br><small>In a 2-for-1, the team that gets fewer players picks up its best free agent.</small></span></label>'+
      '</div>';
    if(!st.playoffs.on) h+='<p class="note">Tip: turn on Playoffs in Settings to compare your playoff weeks separately.</p>';
    if(!trade.team||!trade.give.length||!trade.get.length){
      h+='<div class="card"><div class="empty-state">'+(!trade.team?'Pick a team':'Pick 1–2 players from each side')+' to see how the trade plays out for both teams.</div></div>';
    } else if(!rangeT.days.length){
      h+='<div class="card"><div class="empty-state">No days left in this range.</div></div>';
    } else h+=tradeResultHTML(rangeT,slots,myRaw,theirs,mineN);
  }
  root.innerHTML=h;
  wireFinder(rangeT);
  if($('#tTeam')) $('#tTeam').onchange=e=>{trade.team=e.target.value;trade.get=[];renderTrades();};
  const toggle=(sel,p)=>{const i=sel.findIndex(r=>samePlayer(p,r));if(i>=0)sel.splice(i,1);else{if(sel.length>=2){toast('Up to 2 players a side');return false;}sel.push(pRef(p));}return true;};
  root.querySelectorAll('[data-tg]').forEach(b=>b.onclick=()=>{if(toggle(trade.give,myRaw[+b.dataset.tg]))renderTrades();});
  root.querySelectorAll('[data-tt]').forEach(b=>b.onclick=()=>{if(toggle(trade.get,theirs[+b.dataset.tt]))renderTrades();});
  if($('#tFill')) $('#tFill').onchange=e=>{trade.fill=e.target.checked;renderTrades();};
}
function tradeResultHTML(range,slots,myRaw,theirs,mineN){
  const days=range.days;
  const meR=myValued(finder.solve),me=sideModel(meR,days,slots),them=sideModel(theirs,days,slots);
  const outs=trade.give.map(r=>myRaw.findIndex(p=>samePlayer(p,r))),ins=trade.get.map(r=>theirs.findIndex(p=>samePlayer(p,r)));
  const fill=trade.fill?'exact':'none';
  const needA=outs.length>ins.length,needB=ins.length>outs.length;   // only the side that frees a spot needs the free-agent search
  const pool=trade.fill&&(needA||needB)?faPoolBy(finder.solve):[];
  const SA=needA&&trade.fill?spotModel(me,pool):null,SB=needB&&trade.fill?spotModel(them,pool):null;
  const A=evalSide(me,outs,ins.map(j=>theirs[j]),{exactDrop:true,fill:needA?fill:'none',spot:SA});
  const B=evalSide(them,ins,outs.map(k=>meR[k]),{exactDrop:true,fill:needB?fill:'none',spot:SB});
  const gm=outs.reduce((s,k)=>s+neutralMine(myRaw[k],finder.match),0),tm=ins.reduce((s,j)=>s+neutralPPG(theirs[j],finder.match),0);
  // a side that fills a freed spot is compared with the swap it could make without the trade
  const baseOf=(M,E,S)=>E.fill&&S&&S.swap?S.alt:M.roster;
  const sides=[{name:mineN||'You',label:'You',M:me,E:A,gave:outs.map(k=>meR[k]),got:A.after.filter(p=>ins.some(j=>p.name===theirs[j].name&&p.team===theirs[j].team))},
               {name:trade.team,label:'Them',M:them,E:B,gave:ins.map(j=>theirs[j]),got:B.after.filter(p=>outs.some(k=>p.name===myRaw[k].name&&p.team===myRaw[k].team))}];
  const sg=x=>(x>=0?'+':'')+f1(x),si=x=>(x>0?'+':'')+x,cls=x=>x>0.05?'g':x<-0.05?'w':'';
  sides[0].S=SA;sides[1].S=SB;
  for(const s of sides){s.base=baseOf(s.M,s.E,s.S);s.sb=startsTotal(s.base,days,slots);s.sa=startsTotal(s.E.after,days,slots);}
  const starts=(roster,p)=>{let n=0;for(const i of days){const ps=roster.filter(q=>plays(q.team,i));const {started}=solveDay(ps,slots);started.forEach(j=>{if(ps[j]===p)n++;});}return n;};
  const col=s=>{
    const e=s.E;
    let c='<div class="tcol"><div class="tname1">'+esc(s.name)+'</div>'+
      '<div class="tbig '+cls(e.gain)+'">'+sg(e.gain)+'</div><div class="tlbl">points</div>'+
      '<div class="tline"><b>'+s.sb+' → '+s.sa+'</b> starts ('+si(s.sa-s.sb)+')</div>'+
      '<div class="tlist"><span class="tlbl">Gives</span>'+s.gave.map(p=>'<div>'+esc(p.name)+irTag(p)+'<small>'+starts(s.M.roster,p)+' starts · '+f2(p.proj)+'/gm</small></div>').join('')+'</div>'+
      '<div class="tlist"><span class="tlbl">Gets</span>'+s.got.map(p=>'<div>'+esc(p.name)+irTag(p)+'<small>'+starts(e.after,p)+' starts · '+f2(p.proj)+'/gm</small></div>').join('')+'</div>';
    if(e.drop) c+='<div class="tlist"><span class="tlbl">Drops</span><div class="w">'+esc(e.drop.name)+'</div></div>';
    if(e.fill) c+='<div class="tlist"><span class="tlbl">Open spot*</span><div>'+esc(e.fill.name)+'<small>'+esc(e.fill.team)+' · free agent'+(s.S&&s.S.swap?'; “before” = swapping '+esc(s.S.swap.out.name)+' for '+esc(s.S.swap.in.name):'')+'</small></div></div>';
    else if(e.after.length<s.M.roster.length) c+='<div class="tlist"><span class="tlbl">Roster</span><div class="muted">1 open spot</div></div>';
    return c+'</div>';
  };
  const hi=Math.max(gm,tm),diff=hi>0?(tm-gm)/hi:0,fairNow=Math.abs(diff)<=finder.tol;
  let h='<div class="card pad tlooks"><div><span class="tlbl">How it looks · '+esc(srcLabel(finder.match))+' pts/game</span>'+
    '<b>'+f2(gm)+'</b> you send · <b>'+f2(tm)+'</b> you get</div><span class="badge'+(fairNow?' ok':' warn')+'">'+(fairNow?'Looks fair':(diff>0?'Favours you':'Favours them'))+(Math.round(Math.abs(diff)*100)?' · '+Math.round(Math.abs(diff)*100)+'% to '+(diff>0?'you':'them'):'')+'</span></div>'+
    '<div class="card tcols" style="margin-top:12px">'+sides.map(col).join('')+'</div>';
  h+='<p class="note">Points use '+esc(srcLabel(finder.solve).toLowerCase())+' numbers for every player, over the days in range with daily lineups re-optimized.'+((A.fill||B.fill)?' *The team that frees a spot picks up its best free agent. It could already cut its least useful player for a free agent without trading, so its “before” includes that swap; the trade only gets credit for what the extra spot adds.':'')+' Players on IR are assumed to be back in the lineup right away. Starts are games each player starts in the optimized lineup over '+esc(range.label.toLowerCase())+'.</p>';
  // by week, both sides
  const wk=range.weeks.map(w=>{const d=days.filter(i=>SCHED.weeks[i]===w);return {w,d};}).filter(x=>x.d.length);
  h+='<div class="sect"><h2>By week · '+range.label.toLowerCase()+'</h2></div><div class="card"><div class="twk thead"><span></span><span>You</span><span>Them</span></div>'+
    wk.map(x=>{

/* ===== Save files =====
   One JSON format for the full save and each part; sections present decide
   what an import can apply. The CSV player sheet is the human-friendly way
   to see and edit every value the app accepts. */
const SAVE_APP='lineup-optimizer', SAVE_FORMAT=1;
function todayStamp(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function projStatus(){
  const p=state.data.proj;
  if(p.list.length) return 'Using imported projections: '+p.list.length+' players'+(p.asOf?' · as of '+esc(p.asOf):'')+(p.source?' · from '+esc(p.source):'');
  return 'Using built-in projections: '+DIR.filter(d=>d.proj!=null).length+' players';
}
function effectiveProjections(){
  const out=[],seen=new Set();
  for(const d of DIR){const v=dirProj(d);if(v!=null){out.push({id:d.id||undefined,name:d.name,team:d.team,ppg:v});seen.add(nameKey(d.name)+'|'+d.team);}}
  for(const r of state.data.proj.list) if(!seen.has(nameKey(r.name)+'|'+r.team)) out.push(r);   // imported players not in the directory
  return out;
}
function buildSave(kind){
  const st=state.data.settings,sec={};
  if(kind==='full'||kind==='league') sec.league={name:st.leagueName,slots:{...st.slots},spots:{...st.spots},playoffs:{on:st.playoffs.on,weeks:st.playoffs.weeks.slice()},maxAdds:st.maxAdds,sameDay:st.sameDay,scoring:{...st.scoring}};
  if((kind==='full'||kind==='league')&&state.data.teams.length) sec.teams=state.data.teams.map(t=>({...t}));
  if((kind==='full'||kind==='leaguedata')&&state.data.lg.players.length) sec.leagueData={asOf:state.data.lg.asOf,players:state.data.lg.players};
  if(kind==='full'||kind==='team') sec.team={roster:state.data.roster,ir:state.data.ir,watch:state.data.watch};
  if((kind==='full'||kind==='team')&&Object.keys(state.data.stash).length) sec.team.otherTeams=state.data.stash;
  if(kind==='full'||kind==='projections') sec.projections={asOf:state.data.proj.asOf||todayStamp(),players:effectiveProjections()};
  if(kind==='full') sec.prefs={ppgSource:st.ppgSource,useManual:st.useManual,yahooLeagueId:st.yahooLeagueId};
  return {app:SAVE_APP,format:SAVE_FORMAT,kind,savedAt:new Date().toISOString(),sections:sec};
}
function csvCell(v){const s=v==null?'':String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
const CSV_COLS=['Player','Team','Positions','Projected','Manual','Start %','List','Unlocked','Fantasy Team','Roster Slot','Status','Last 14','Last 30','Player ID'];
function buildCsv(){
  const rows=[],seen=new Set();
  const listOf={roster:'Roster',ir:'IR',watch:'Watch'};
  for(const l of ['roster','ir','watch']) for(const p of state.data[l]){
    const d=dirLookup(p);
    const g=lgLookup(p)||{};
    rows.push([p.name,p.team,p.pos.join(', '),p.derived!=null?p.derived:(d?dirProj(d):projOf(p)),p.manual,p.start,listOf[l],p.unlocked?'Y':'',ownerOf(p)||'',g.slot,g.status,p.l14!=null?p.l14:g.l14,p.l30!=null?p.l30:g.l30,p.id||(d&&d.id)||'']);
    if(d) seen.add(d); 
  }
  const rest=DIR.filter(d=>!seen.has(d)).sort((x,y)=>x.team.localeCompare(y.team)||x.name.localeCompare(y.name));
  for(const d of rest){const g=lgLookup(d)||{};rows.push([d.name,d.team,(g.pos||d.pos).join(', '),dirProj(d),'','','','',ownerOf(d)||'',g.slot,g.status,g.l14,g.l30,d.id||'']);}
  return '﻿'+[CSV_COLS].concat(rows).map(r=>r.map(csvCell).join(',')).join('\r\n');   // BOM so Excel keeps accents
}
function download(name,text,type){
  try{
    const url=URL.createObjectURL(new Blob([text],{type}));
    const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(url);a.remove();},1500);
    toast('Downloaded '+name);
  }catch(e){toast('Download failed in this browser');}
}
function downloadSave(kind){
  if(kind==='csv') return download('lineup-players-'+todayStamp()+'.csv',buildCsv(),'text/csv;charset=utf-8');
  download('lineup-'+kind+'-'+todayStamp()+'.json',JSON.stringify(buildSave(kind),null,1),'application/json');
}
/* --- reading files --- */
function parseCsv(text){
  text=String(text).replace(/^﻿/,'');
  const first=text.split(/\r?\n/)[0]||'';
  const delim=(first.match(/\t/g)||[]).length>(first.match(/,/g)||[]).length?'\t':((first.match(/;/g)||[]).length>(first.match(/,/g)||[]).length?';':',');
  const rows=[];let row=[],cell='',q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cell+='"';i++;}else q=false;}else cell+=c;}
    else if(c==='"') q=true;
    else if(c===delim){row.push(cell);cell='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell='';}
    else cell+=c;
  }
  if(cell!==''||row.length){row.push(cell);rows.push(row);}
  return rows.filter(r=>r.some(c=>String(c).trim()!==''));
}
function readCsvSave(text){
  const rows=parseCsv(text); if(rows.length<2) return null;
  const head=rows[0].map(h=>h.trim().toLowerCase());
  const col=(...names)=>head.findIndex(h=>names.some(n=>h===n||h.startsWith(n)));
  const c={name:col('player','name'),team:col('team'),pos:col('positions','position','pos'),proj:col('projected','projection','proj'),
           man:col('manual'),start:col('start'),list:col('list'),unl:col('unlocked'),id:col('player id','id'),
           owner:col('fantasy team','owner'),slot:col('roster slot','slot'),status:col('status','injury'),l14:col('last 14','l14'),l30:col('last 30','l30')};
  if(c.name<0||c.team<0) return null;
  const proj=[],lists={roster:[],ir:[],watch:[]},lgp=[],owners=[];let skipped=0;
  for(const r of rows.slice(1)){
    const g=i=>i>=0?String(r[i]??'').trim():'';
    const name=g(c.name),team=normTeam(g(c.team)); if(!name){continue;} if(!team){skipped++;continue;}
    const id=Number(g(c.id))||undefined, pv=numOrNull(g(c.proj));
    if(pv!==null) proj.push({id,name,team,ppg:pv});
    const own=g(c.owner),slot=g(c.slot),stt=g(c.status),a14=numOrNull(g(c.l14)),a30=numOrNull(g(c.l30));
    if(own||slot||stt||a14!==null||a30!==null){
      lgp.push({id,name,team,pos:g(c.pos),owner:own,slot,status:stt,l14:a14,l30:a30});
      if(own&&!FA_WORDS.test(own)&&!owners.includes(own)) owners.push(own);
    }
    const lv=g(c.list).toLowerCase(), l=lv.startsWith('ros')?'roster':lv==='ir'||lv.startsWith('ir')||lv.startsWith('inj')?'ir':lv.startsWith('wat')?'watch':null;
    if(l){
      let pos=parsePositions(g(c.pos)); if(!pos.length){const d=dirLookup({id,name,team});pos=d?d.pos.slice():['C'];}
      const p={id,name,team,pos}; const m=numOrNull(g(c.man)); if(m!==null)p.manual=m;
      const st=pctOrNull(g(c.start)); if(st!==null&&st!==100)p.start=st;
      if(/^(y|yes|true|1|x)$/i.test(g(c.unl))) p.unlocked=true;
      lists[l].push(p);
    }
  }
  const sec={};
  if(proj.length) sec.projections={asOf:todayStamp(),players:proj};
  if(lgp.length) sec.leagueData={asOf:todayStamp(),players:lgp};
  if(owners.length) sec.teams=owners.map(name=>({name}));
  if(lists.roster.length+lists.ir.length+lists.watch.length) sec.team=lists;
  return {sections:sec,kind:'csv',skipped};
}
function readSave(text){
  const t=String(text||'').trim(); if(!t) return null;
  if(t[0]==='{'||t[0]==='['){
    let d; try{d=JSON.parse(t);}catch(e){return null;}
    if(d&&d.app===SAVE_APP&&d.sections) return {sections:d.sections,kind:d.kind||'full',savedAt:d.savedAt};
    if(d&&Array.isArray(d.roster)){   // older "copy export" text from versions 2-13
      const s=d.settings||{},sec={team:{roster:d.roster,ir:d.ir||[],watch:d.watch||[]}};
      if(d.settings) {sec.league={name:s.leagueName,slots:s.slots,spots:s.spots,playoffs:s.playoffs};sec.prefs={ppgSource:s.ppgSource,useManual:s.useManual,yahooLeagueId:s.yahooLeagueId};}
      return {sections:sec,kind:'legacy'};
    }
    return null;
  }
  return readCsvSave(t);
}
const SECTION_INFO={
  league:{label:'League settings',sum:s=>{const n=Object.values(s.slots||{}).reduce((a,b)=>a+(+b||0),0);return (s.name?esc(s.name)+' · ':'')+n+' lineup slots · '+((s.spots&&s.spots.bench)??'?')+' bench'+(s.playoffs&&s.playoffs.on?' · playoffs wk '+(s.playoffs.weeks||[]).join(', '):'');}},
  team:{label:'My team',sum:s=>(s.roster||[]).length+' roster · '+(s.ir||[]).length+' IR · '+(s.watch||[]).length+' watchlist',warn:'Replaces your roster, IR and watchlist'},

  teams:{label:'Teams',sum:s=>s.length+' teams: '+s.slice(0,4).map(t=>esc(t.name||t)).join(', ')+(s.length>4?'…':''),warn:'Replaces your team list (your pick of “my team” is kept by name)'},
  leagueData:{label:'League player data',sum:s=>{const p=s.players||[];return p.length+' players · '+p.filter(r=>r.owner&&!FA_WORDS.test(r.owner)).length+' owned'+(p.some(r=>r.l14!=null||r.l30!=null)?' · with Last 14/30':'')+(s.asOf?' · as of '+esc(s.asOf):'');},warn:'Replaces owners, roster slots, status and Last 14/30'}
};
function openImport(text,fname){

function applySections(sec,pick,fname){

    if(sec.league.scoring){const m=normalize({settings:{scoring:sec.league.scoring}});st.scoring=m.settings.scoring;NHL_MEMO.clear();}
  }
  if(pick.includes('prefs')){

    st.ppgSource=n.settings.ppgSource;st.useManual=n.settings.useManual;st.yahooLeagueId=n.settings.yahooLeagueId;
  }
  if(pick.includes('team')){

    cur.roster=n.roster;cur.ir=n.ir;cur.watch=n.watch;

  }
  if(pick.includes('leagueData')){
    cur.lg={asOf:String(sec.leagueData.asOf||todayStamp()),source:String(fname||''),players:cleanLgPlayers(sec.leagueData.players)};LG_IDX=null;
    const have=new Set(cur.teams.map(t=>t.name.toLowerCase()));   // any owner not yet in Teams gets added
    for(const o of new Set(cur.lg.players.map(r=>r.owner).filter(Boolean))) if(!have.has(o.toLowerCase())){cur.teams.push({name:o});have.add(o.toLowerCase());}
  }
  if(pick.includes('projections')){
    cur.proj={asOf:String(sec.projections.asOf||todayStamp()),source:String(fname||''),list:cleanProjList(sec.projections.players)};
    PROJ_IDX=null;
  }
  save();
}

/* Name search: ignores accents and case; matches the start of first or last
   name, or anywhere in the full name ("lafren" finds Lafrenière). */
function searchDir(q){
  const k=nameKey(q); if(k.length<2) return [];
  const scored=[];
  for(const d of DIR){
    const n=nameKey(d.name),parts=n.split(' ');
    let s=-1;
    if(n.startsWith(k)) s=0; else if(parts.some(w=>w.startsWith(k))) s=1; else if(n.includes(k)) s=2;
    if(s>=0) scored.push([s,d]);
  }
  return scored.sort((a,b)=>a[0]-b[0]||a[1].name.localeCompare(b[1].name)).slice(0,8).map(x=>x[1]);
}
function wireAutocomplete(input,box,onPick){
  let items=[],active=-1;
  const close=()=>{box.classList.add('hidden');active=-1;};
  const paint=()=>{
    box.innerHTML=items.map((d,i)=>'<div class="opt'+(i===active?' on':'')+'" data-i="'+i+'" role="option"><span>'+esc(d.name)+'</span><small>'+d.team+' · '+d.pos.join(', ')+(ownerOf(d)?' · '+esc(ownerOf(d)):'')+'</small></div>').join('');
    box.classList.toggle('hidden',!items.length);
    box.querySelectorAll('.opt').forEach(o=>o.onpointerdown=e=>{e.preventDefault();onPick(items[+o.dataset.i]);close();});
  };
  input.addEventListener('input',()=>{items=searchDir(input.value);active=-1;paint();});
  input.addEventListener('keydown',e=>{
    if(box.classList.contains('hidden')) return;
    if(e.key==='ArrowDown'){active=Math.min(items.length-1,active+1);paint();e.preventDefault();}
    else if(e.key==='ArrowUp'){active=Math.max(0,active-1);paint();e.preventDefault();}
    else if(e.key==='Enter'&&active>=0){onPick(items[active]);close();e.preventDefault();}
    else if(e.key==='Escape') close();
  });
  input.addEventListener('blur',()=>setTimeout(close,120));
}

    '<div class="field" id="eStartWrap"><label>Start % (goalies)</label><input id="eStart" type="number" inputmode="numeric" step="1" min="0" max="100" placeholder="100" value="'+v(p.start)+'">'+
    '<small>Blank = his share of starts from NHL stats. Scales per-start values (Manual, Season, Last 30/14); Projected already includes it.</small></div>'+
    '<div class="actions"><button class="btn primary grow" id="eSave">Save</button>'+
    (isNew?'':others.map(o=>'<button class="btn" data-emove="'+o+'">To '+LIST_NAMES[o]+'</button>').join('')+'<button class="btn danger" id="eDel">Delete</button>')+
    '<button class="btn" id="eCancel">Cancel</button></div>');
  let pickedId=p.id||null,pickedName=p.name||'';
  const listProj=d=>{const el=$('#eDerived');if(!el)return;const v=d?dirProj(d):null;el.placeholder=v!=null?f2(v):'—';const s=el.parentElement.querySelector('small');if(s)s.textContent=v!=null?'Blank = list value '+f2(v):'Season projection per team game';};
  if(!isNew) listProj(dirLookup(p));

    document.querySelectorAll('[data-pos]').forEach(b=>b.classList.toggle('on',d.pos.includes(b.dataset.pos)));
    showStart();
  });
  const showStart=()=>$('#eStartWrap').classList.toggle('hidden',!document.querySelector('[data-pos="G"].on'));
  document.querySelectorAll('[data-pos]').forEach(b=>b.onclick=()=>{b.classList.toggle('on');showStart();});

    const q={name:$('#eName').value.trim(),team:$('#eTeam').value,pos:[...document.querySelectorAll('[data-pos].on')].map(b=>b.dataset.pos)};
    if(pickedId&&nameKey(q.name)===nameKey(pickedName)) q.id=pickedId;   // keep the directory link unless the name was changed
    for(const [key,id] of [['manual','eManual'],['derived','eDerived'],['l14','eL14'],['l30','eL30']]){const n=numOrNull($('#'+id).value);if(n!==null)q[key]=n;}

    parsed=parsePaste($('#pTxt').value);
    const good=parsed.filter(r=>!r.problems.length);
    const matches=everyone().filter(p=>findMatch(p,good)).length;
    let h='';
    if(parsed.length){
      h='<div class="preview">'+parsed.map(r=>'<div class="row'+(r.problems.length?' bad':'')+'"><span class="pname">'+esc(r.name)+
        (r.team?'<small>'+r.team+'</small>':'')+(r.pos.length?chips(r.pos):'')+'</span><span class="pts">'+
        (r.problems.length?'check '+esc(r.problems.join(', ')):(r.ppg===null?'no PPG':f2(r.ppg))+(r.start!==null?' · '+r.start+'%':''))+'</span></div>').join('')+'</div>'+
        '<p class="note">'+good.length+' rows ready'+(parsed.length>good.length?', '+(parsed.length-good.length)+' skipped':'')+' · '+matches+' of your players matched.</p>';
    }
    $('#pPrev').innerHTML=h;
    $('#pReplace').disabled=$('#pAppend').disabled=!good.length;
    $('#pUpdate').disabled=!matches;
  };
  $('#pTxt').oninput=update;
  const toPlayer=r=>{const q={name:r.name,team:r.team,pos:r.pos};if(r.ppg!==null)q[field]=r.ppg;if(r.start!==null&&r.start!==100&&r.pos.includes('G'))q.start=r.start;return q;};
  const commit=replace=>{
    const good=parsed.filter(r=>!r.problems.length).map(toPlayer);
    if(replace) state.data[list]=good; else state.data[list]=state.data[list].concat(good);
    save();closeSheet();toast((replace?'Loaded ':'Added ')+good.length+' players');renderAll();
  };
  $('#pUpdate').onclick=()=>{
    const good=parsed.filter(r=>!r.problems.length);let n=0;
    for(const p of everyone()){
      const m=findMatch(p,good);if(!m)continue;
      if(m.ppg!==null){p[field]=m.ppg;n++;}
      if(m.start!==null&&p.pos.includes('G')){if(m.start===100)delete p.start;else p.start=m.start;}
    }
    save();closeSheet();toast('Updated '+field+' PPG for '+n+' players');renderAll();
  };
  $('#pReplace').onclick=()=>commit(true);
  $('#pAppend').onclick=()=>commit(false);
  $('#pCancel').onclick=closeSheet;
  setTimeout(()=>{try{$('#pTxt').focus();}catch(e){}},50);
}

/* ===== Wiring ===== */
function renderAll(){
  renderHeader();
  if(state.tab==='lineup')renderLineup();
  if(state.tab==='roster')renderRoster();
  if(state.tab==='stream')renderStreamers();
  if(state.tab==='settings')renderSettings();
  if(state.tab==='trades')renderTrades();
  if(state.tab==='league')renderLeague();
}
function goTab(tab){
  state.tab=tab;
  document.querySelectorAll('nav.tabs button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
  ['lineup','roster','stream','trades','league','settings'].forEach(t=>$('#tab-'+t).classList.toggle('hidden',t!==state.tab));
  window.scrollTo(0,0);renderAll();
}
document.querySelectorAll('nav.tabs button').forEach(b=>b.onclick=()=>goTab(b.dataset.tab));
document.querySelectorAll('#rangeSeg button').forEach(b=>b.onclick=()=>{
  if(b.dataset.r==='season') state.seasonView=true; else {state.seasonView=false;state.range=b.dataset.r;}
  state.collapsed={};window.scrollTo(0,0);renderAll();
});
function goWeek(delta){
  const i=WEEKS.indexOf(state.week)+delta;if(i<0||i>=WEEKS.length)return;
  state.week=WEEKS[i];state.range=defaultRange();state.collapsed={};renderAll();
}
$('#prevWk').onclick=()=>goWeek(-1);
$('#nextWk').onclick=()=>goWeek(1);
nhlLoadCache();
renderAll();
nhlFetch(false);

</script>
